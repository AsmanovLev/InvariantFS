      # /root/.ssh/authorized_keys; nothing was passing it, so the only path
      # exercised was the one that needs a pty.
      #
      # Generated BEFORE the volume build, because that step is what bakes the
      # authorized_keys into the image. Exported to GITHUB_ENV so the boot step
      # picks it up too. Disposable: this key only ever reaches a throwaway
      # volume on a runner that dies with the job.
      - name: initramfs for the boot harnesses
        run: bash tools/mkinitramfs.sh

      # Void boot: DISABLED TEMPORARILY. It passes and has cost real time on
      # every run; the signal the user wants right now is the Arch boot, which is
      # the first of these harnesses that has never succeeded anywhere. Re-enable
      # by deleting this comment -- the steps themselves are unchanged in
      # tools/boot-void-qemu.sh and were green at 2675cbd.
      - name: debian root -> InvariantFS volume
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/debian"
          mkdir -p "$S"
          # configure-debian.sh provisions an EXISTING Debian root (it
          # exits 1 unless sbin/init or lib/systemd is present) and
          # installs no packages itself, so the root has to be created
