  # Debian, natively: the same dpkg-buildpackage the matrix runs, but on
  # the real Debian toolchain instead of Ubuntu's. Full suite (foreign
  # legs skip, staged legs run, debian leg native).
  packaging-debian:
    runs-on: ubuntu-22.04
    container: debian:bookworm
    timeout-minutes: 40
    needs: [scope]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.deb == 'true'
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential pkg-config git \
            libfuse3-dev zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 file gawk gzip debhelper devscripts \
            ca-certificates

      - name: build
        run: make -j"$(nproc)" && make helpers

      - name: packaging suite (deb native)
        run: bash tools/test-packaging.sh

      - name: upload debian packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-deb
          path: |
            /tmp/invfs-pkg-test-*/invfs_*.deb
          if-no-files-found: ignore

  # Arch, natively: full suite in an Arch container (arch leg staged as
  # elsewhere) PLUS a real makepkg of the recipe against the
  # HEAD-built artifact -- the exact proof the staged leg cannot give
  # (it executes package(), never makepkg: the sha256sums filename bug
  # lived there). Containers run as root but makepkg refuses root (and
  # current pacman removed --asroot), so the build runs as a builder user.
  packaging-arch:
    runs-on: ubuntu-22.04
    container: archlinux:base
    timeout-minutes: 40
    needs: [scope]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.arch == 'true'
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          pacman -Sy --needed --noconfirm gcc make pkgconf fuse3 zstd zlib \
            python3 tar gzip file awk fakeroot libarchive git

      - name: build
        run: make -j"$(nproc)" && make helpers

      - name: packaging suite (arch staged)
        run: bash tools/test-packaging.sh

      - name: real makepkg of the recipe
        run: |
          set -euo pipefail
          ART=$(ls -t dist/invfs-*-x86_64.tar.zst | head -1)
          D=/tmp/archpkg; rm -rf "$D"; mkdir -p "$D"
          cp packaging/PKGBUILD dist/SHA256SUMS "$ART" "$D/"
          cd "$D"
          H=$(cut -d' ' -f1 SHA256SUMS)
          sed -i "s/'[0-9a-f]\{64\}'/'$H'/" PKGBUILD
          # makepkg refuses root and current pacman removed --asroot:
          # build as an unprivileged user instead (HOME + cwd are his).
          id builder >/dev/null 2>&1 || useradd -m builder
          chown -R builder:builder "$D"
          runuser -u builder -- makepkg --noconfirm
          ls invfs-*.pkg.tar.zst
          pacman -Qip invfs-*.pkg.tar.zst | head -5
          mkdir -p "$GITHUB_WORKSPACE/pkg"
          cp invfs-*.pkg.tar.zst "$GITHUB_WORKSPACE/pkg/"

      - name: upload arch packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-arch
          path: |
            pkg/invfs-*.pkg.tar.zst
          if-no-files-found: ignore

  # Void, natively: real xbps-src build of the template against the
  # HEAD-built artifact (staged do_install() runs inside the suite too).
  # xbps-src wants its void-packages tree: shallow clone + binary
  # bootstrap, then a local srcpkgs overlay with re-pinned distfiles
  # (same test-staging shape as the Gentoo job).
  packaging-void:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      # xbps-src builds as non-root inside user+mount namespaces and bind-
      # mounts /proc into its masterdir: needs real privilege, seccomp-
      # unconfined was not enough (bind mount denied).
      options: --privileged
    timeout-minutes: 90
    needs: [scope]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.void == 'true'
    # ethereal chroot style: the DOCUMENTED Docker flow (common/chroot-style
    # README). No namespaces, no mounts: symlinks emulate the chroot, the
    # container root is the masterdir, and BREAKOUT lets root run it all.
    # Disposable container; the symlinks die with it.
    env:
      XBPS_CHROOT_CMD: ethereal
      XBPS_ALLOW_CHROOT_BREAKOUT: "yes"
    # The full image ships no bash, so the runner falls back to sh and
    # every `set -euo pipefail` step dies with "Illegal option". The
    # bootstrap step installs bash under sh; everything after runs bash.
    defaults:
      run:
        shell: bash {0}
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: bootstrap bash (no bash in the image; runner falls back to sh)
        shell: sh {0}
        run: xbps-install -Sy bash

      - name: toolchain + void-packages tree
        run: |
          set -euo pipefail
          # No xbps-src binary here: the package is absent from the repo
          # pool in this image, and the git clone + binary-bootstrap below
          # is the self-sufficient documented path (it fetches its own
          # static toolchain).
          xbps-install -Syu git base-devel pkg-config \
            fuse3-devel zlib-devel libzstd-devel zstd python3 tar \
            gzip curl file 2>&1 | tail -2
          [ -d /tmp/vp ] || git clone --depth 1 https://github.com/void-linux/void-packages /tmp/vp
          cd /tmp/vp && ./xbps-src binary-bootstrap
          # ethereal model: swap the bootstrapped masterdir for a symlink
          # to / (the container root, which already carries base-devel).
          # NOTE the name: under ethereal the default masterdir is plain
          # 'masterdir', not 'masterdir-<arch>'. Remove by existence, not
          # by glob (an unmatched glob plus set -e aborts the step; an
          # existing dir makes ln try to link *inside* it and fail).
          for d in /tmp/vp/masterdir /tmp/vp/masterdir-*/; do
            [ -e "$d" ] || [ -L "$d" ] || continue
            rm -rf "$d"
          done
          ln -s / /tmp/vp/masterdir

      - name: build
        run: make -j"$(nproc)" && make helpers

      - name: packaging suite (void staged)
        run: bash tools/test-packaging.sh

      - name: real xbps-src build of the template
        run: |
          set -euo pipefail
          ART=$(ls -t dist/invfs-*-x86_64.tar.zst | head -1)
          OVER=/tmp/vp/srcpkgs/invfs
          mkdir -p "$OVER"
          cp packaging/void/template "$OVER/template"
          # The overlay copy tracks the just-built artifact, not the
          # committed template: version skew (template re-pinned only at
          # release time) used to point distfiles at the published older
          # tarball while checksum= was re-pinned to the local build -- a
          # guaranteed mismatch. Bump version= in the overlay only.
          BUILT_VER=$(tar --zstd -xOf "$ART" --wildcards '*/VERSION' | head -1 | sed 's/^v//')
          sed -i "s/^version=.*/version=$BUILT_VER/" "$OVER/template"
          # xbps-src looks for distfiles at
          # hostdir/sources/<pkgname>-<version>/ (00-distfiles.sh:
          # srcdir=$XBPS_SRCDISTDIR/$pkgname-$version); anything else is
          # invisible and triggers a real fetch.
          SRCDIST=/tmp/vp/hostdir/sources/invfs-$BUILT_VER
          mkdir -p "$SRCDIST"
          cp "$ART" "$SRCDIST/"
          H=$(cut -d' ' -f1 dist/SHA256SUMS)
          sed -i "s/^checksum=.*/checksum=$H/" "$OVER/template"
          grep -q "^checksum=$H$" "$OVER/template" || { echo "re-pin failed"; exit 1; }
          cd /tmp/vp && ./xbps-src pkg invfs
          ls hostdir/binpkgs/invfs-*.xbps
          mkdir -p "$GITHUB_WORKSPACE/pkg-void"
          cp hostdir/binpkgs/invfs-*.xbps "$GITHUB_WORKSPACE/pkg-void/"

      - name: upload void packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-void
          path: |
            pkg-void/invfs-*.xbps
          if-no-files-found: ignore

  # Alpine, natively: real abuild of the APKBUILD against the HEAD-built artifact
  # inside a pure alpine container.
  packaging-alpine:
    runs-on: ubuntu-22.04
    container: alpine:latest
    timeout-minutes: 30
    needs: [scope]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.alpine_pkg == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          apk update
          apk add alpine-sdk zstd sudo bash tar gzip curl file shadow \
            fuse3-dev zlib-dev zstd-dev make pkgconf git linux-headers
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          adduser -D -G abuild builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: build
        run: make -j"$(nproc)" && make helpers

      - name: packaging suite (alpine staged)
        run: bash tools/test-packaging.sh

      - name: real abuild of the package
        run: |
          set -euo pipefail
          ART=$(ls -t dist/invfs-*-x86_64.tar.zst | head -1)
          D=/tmp/apkpkg; rm -rf "$D"; mkdir -p "$D"
          cp packaging/alpine/APKBUILD "$D/"
          cp "$ART" "$D/"
          H=$(sha256sum "$ART" | cut -d' ' -f1)
          BASE=$(basename "$ART")
          sed -i "s|sha256sums=.*|sha256sums=\"$H  $BASE\"|" "$D/APKBUILD"
          chown -R builder:abuild "$D"
          su builder -c 'abuild-keygen -a -i -n'
          cd "$D"
          su builder -c 'abuild -F -c -r'
          mkdir -p "$GITHUB_WORKSPACE/pkg-apk"
          cp /home/builder/packages/*/*/*.apk "$GITHUB_WORKSPACE/pkg-apk/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/pkg-apk"

      - name: upload alpine packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-apk
          path: |
            pkg-apk/invfs-*.apk
          if-no-files-found: ignore
