        with:
          name: iso-gentoo-install-logs
          path: |
            ${{ runner.temp }}/iso-gentoo/serial.log
            ${{ runner.temp }}/iso-gentoo/serve.log
            ${{ runner.temp }}/iso-gentoo/ssh.log
          if-no-files-found: warn

  # Stock-Alpine-virt-ISO install onto InvariantFS. Real-time streaming serial
  # with event triggers (detects login prompt, runs guest setup script,
  # verifies PASS marker).
  installation-iso-alpine:
    needs: [scope, packaging-alpine]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.iso_alpine == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 qemu-system-x86 qemu-utils e2fsprogs

      - name: build
        run: make -j"$(nproc)"

      - name: alpine ISO install onto InvFS
        run: |
          WORK="$RUNNER_TEMP/iso-alpine" bash tools/iso-alpine-install.sh

