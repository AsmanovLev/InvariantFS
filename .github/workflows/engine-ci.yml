name: engine-ci

on:
  push:
    branches: ["**"]
  pull_request:
  # The distro install harnesses are heavy: they download a full Arch
  # bootstrap (~120 MB) or a Void ROOTFS, build a 1.8 GB staging tree, and
  # then mkfs + import it. They are not a per-push gate; they are a loop,
  # which is the point (see docs/INSTALL-MATRIX.md §7). Weekly + on demand.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: dependencies
        run: |
          sudo apt-get update -qq
          # WP205: qemu-utils is not optional for the unit gate. invf-plugin_mt_test
          # builds its qcow2 fixture with qemu-img + qemu-io and was never able to
          # run here -- the test skipped itself, so the 4-thread IPC leg went
          # unmeasured and nothing said so. It skips again if these are absent,
          # which is right, but CI should not be that host.
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev python3 qemu-utils

      - name: build
        run: make -j"$(nproc)"

      - name: repo hygiene
        run: bash tools/check-repo-hygiene.sh

      - name: unit tests
        run: make test

      - name: engine e2e suites
        run: |
          set -u
          mkdir -p .ci-tools /tmp/invfs-e2e
          SUITES="test-meta-v3 test-meta-v3-delta test-meta-v3-dirent test-meta-v3-fold \
                  test-meta-v3-fsck test-meta-v3-hardlink test-meta-v3-inode \
                  test-meta-v3-multidev test-meta-v3-mut test-meta-v3-overlay \
                  test-meta-v3-recipe test-meta-v3-write test-meta-v3-xattr"
          FAIL=0
          for s in $SUITES; do
            if [ ! -f "tools/$s.sh" ]; then
              echo "error: tools/$s.sh not found!"
              FAIL=1
              continue
            fi
            # relocate dev/shm to disk to keep CI tmpfs bounded
            sed 's|/dev/shm|/tmp/invfs-e2e|g' "tools/$s.sh" > ".ci-tools/$s.sh"
            echo "::group::$s"
            if bash ".ci-tools/$s.sh"; then
              echo "$s: PASS"
            else
              echo "$s: FAIL"; FAIL=1
            fi
            echo "::endgroup::"
            rm -rf /tmp/invfs-e2e
            mkdir -p /tmp/invfs-e2e
          done
          [ "$FAIL" = 0 ] || { echo "engine e2e: at least one suite FAILED"; exit 1; }
          echo "engine e2e: ALL SUITES PASS"

  # The four-target packaging gate. Until this job existed,
  # tools/test-packaging.sh was in neither `make e2e` nor this workflow, so
  # the packaging layer had never run in any automated loop -- which is how
  # "packaging/install.sh exited 1 on every host with a C compiler" survived
  # as an undiscovered state. Cheap (no network, no sudo, seconds), so it
  # runs on every push alongside `make test`.
  packaging:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev zstd python3

      - name: build
        run: make -j"$(nproc)" && make helpers

      - name: packaging recipes + bootstrap negative controls
        run: bash tools/test-packaging.sh

  # The distro install harnesses, which build a real Arch and a real Void
  # root and take them through mkfs/import/fsck/verify/bit-exact reads.
  # Offline only (no boot, no FUSE) -- see the header of each script. Scratch
  # is pinned under RUNNER_TEMP so a 1.8 GB staging tree never lands on the
  # runner's small /tmp.
  distro-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: dependencies
        # WP224: this list was short in exactly the ways the suites are brittle
        # about, each found by RUNNING them rather than by reading them:
        #   fuse3           -- fusermount3 lives here; libfuse3-dev does NOT pull
        #                       it, and without it nothing can mount anything
        #   libjxl-tools    -- cjxl/djxl, which test-jxl.sh hard-requires
        #   p7zip-full      -- 7z/7za for the p7z and qcow2 fixtures
        #   qemu-system-x86 -- the BOOT harnesses below
        #   e2fsprogs xfsprogs dosfstools exfatprogs unzip zip
        #                    -- mkfs.* / debugfs / e2fsck / 7z: these install
        #                       into /sbin, which is on root's PATH and NOT on
        #                       a normal user's, so the suites could not find
        #                       their own tools
        #   python3-numpy python3-pil -- the fixture generators in test-jxl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev fuse3 zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 python3-numpy python3-pil \
            libjxl-tools p7zip-full qemu-system-x86 qemu-utils \
            e2fsprogs xfsprogs dosfstools exfatprogs unzip zip acl

      - name: host capability preflight
        # One report of every gap instead of a sweep dying at the first one.
        run: bash tools/e2e-preflight.sh --quiet || true

      - name: "fuse: allow other users"   # quoted: a colon-space in an
        # unquoted YAML scalar makes the parser read this as a mapping key
        # test-acl.sh mounts with -o allow_other; without this the suite stops
        # with "/etc/fuse.conf needs user_allow_other".
        run: |
          sudo sh -c 'grep -q "^user_allow_other" /etc/fuse.conf \
            || echo user_allow_other >> /etc/fuse.conf'
          grep -v "^#" /etc/fuse.conf || true

      - name: build
        run: make -j"$(nproc)" && make helpers

      - name: arch root -> InvariantFS volume
        run: |
          ARCH_WORK="$RUNNER_TEMP/arch" \
            bash tools/test-arch-install.sh

      - name: void root -> InvariantFS volume (offline)
        run: |
          INVFS_VOID_WORK="$RUNNER_TEMP/void" \
            bash tools/test-void-install.sh

      # WP224: THE BOOT. Until now this job imported a Void root and checked it
      # offline -- invf-import, invf-fsck, offline invf-cat -- and never booted
      # it, so a volume that could not serve a running system passed here. That
      # is the gap docs/INSTALL-MATRIX.md 7 describes, and it is the one that
      # hides a broken FUSE mount: offline reads go through a different path
      # than a live one.
      - name: initramfs for the boot harnesses
        run: bash tools/mkinitramfs.sh

      - name: void root BOOTS on InvariantFS (single device)
        run: |
          set -o pipefail
          INVFS_VOID_WORK="$RUNNER_TEMP/voidboot" \
          INVFS_VOID_LOGDIR="$RUNNER_TEMP/voidboot-logs" \
          INVFS_VOID_KEEP=0 \
            bash tools/boot-void-qemu.sh 2>&1 | tee "$RUNNER_TEMP/voidboot.log"
          # logs survive a failure: the serial console is the evidence
          cp -r "$RUNNER_TEMP/voidboot-logs" "$RUNNER_TEMP/artifacts" \
            2>/dev/null || true

      - name: void root BOOTS on InvariantFS (two devices)
        run: |
          set -o pipefail
          INVFS_VOID_MODE=multi \
          INVFS_VOID_WORK="$RUNNER_TEMP/voidboot2" \
          INVFS_VOID_LOGDIR="$RUNNER_TEMP/voidboot2-logs" \
          INVFS_VOID_KEEP=0 \
            bash tools/boot-void-qemu.sh 2>&1 | tee "$RUNNER_TEMP/voidboot2.log"

      - name: upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-logs
          path: |
            ${{ runner.temp }}/voidboot-logs
            ${{ runner.temp }}/voidboot2-logs
          if-no-files-found: ignore
