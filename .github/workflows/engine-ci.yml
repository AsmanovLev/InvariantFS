name: engine-ci

# Least privilege: checkout needs contents:read, the serial-log upload
# needs actions:write, nothing else in this file calls the API.
permissions:
  contents: read
  actions: write

# One active run per branch: at ~20-40 pushes a day of multi-hour
# filesystem runs, concurrent runs would stack dozens deep. A new push
# cancels the stale run -- only the newest tree needs a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
  pull_request:
  # The distro install harnesses are heavy: they download a full Arch
  # bootstrap (~120 MB) or a Void ROOTFS, build a 1.8 GB staging tree, and
  # then mkfs + import it. They are not a per-push gate; they are a loop,
  # which is the point (see docs/INSTALL-MATRIX.md §7). Weekly + on demand.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "force the full tier (all jobs) regardless of scope"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  # Scope gate: distro-specific changes run distro-specific jobs, not the
  # whole tier. Rules (first match wins in the case list below):
  #   docs/md/man only ............ docs-gate only (heavy tiers skip)
  #   packaging/<distro> .......... that distro's package+install jobs
  #   shared packaging (install.sh, units, hooks, test-packaging.sh)
  #     ........................... all distro jobs
  #   install scripts (iso-*, boot-*, test-*-install.sh)
  #     ........................... the matching install jobs
  #   everything else (src, Makefile, tools, .github, unknown)
  #     ........................... FULL tier (safe default: over-run)
  # engine + docs-gate always run (needs chains + load-bearing hygiene).
  # e2e-full + soak run on full runs only (they test engine code).
  # Tag discipline: tag a release only off a full-green run -- dispatch
  # with full=true (the default) when the push itself ran scoped.
  scope:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      full: ${{ steps.calc.outputs.full }}
      deb: ${{ steps.calc.outputs.deb }}
      rpm: ${{ steps.calc.outputs.rpm }}
      arch: ${{ steps.calc.outputs.arch }}
      gentoo: ${{ steps.calc.outputs.gentoo }}
      void: ${{ steps.calc.outputs.void }}
      boot_arch: ${{ steps.calc.outputs.boot_arch }}
      boot_void: ${{ steps.calc.outputs.boot_void }}
      boot_debian: ${{ steps.calc.outputs.boot_debian }}
      boot_fedora: ${{ steps.calc.outputs.boot_fedora }}
      iso_arch: ${{ steps.calc.outputs.iso_arch }}
      iso_void: ${{ steps.calc.outputs.iso_void }}
      iso_gentoo: ${{ steps.calc.outputs.iso_gentoo }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: calc
        run: |
          FULL=0; DEB=0; RPM=0; ARCH=0; GEN=0; VOID=0
          BA=0; BV=0; BD=0; BF=0; IA=0; IV=0; IG=0
          force_full() { FULL=1; }
          if [ "${{ github.event_name }}" = schedule ]; then force_full
          elif [ "${{ github.event_name }}" = workflow_dispatch ] && \
               [ "${{ inputs.full }}" = "true" ]; then force_full
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            [ -z "$BASE" ] && BASE="${{ github.event.before }}"
            case "$BASE" in ""|0000000000000000000000000000000000000000) force_full;; *)
            FILES=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || echo FORCE_FULL)
            [ "$FILES" = FORCE_FULL ] && force_full
            for f in $FILES; do
              case "$f" in
                docs/*|*.md|packaging/man/*) ;;
                packaging/debian/*) DEB=1; BD=1;;
                packaging/invfs.spec) RPM=1; BF=1;;
                packaging/PKGBUILD) ARCH=1; BA=1; IA=1;;
                packaging/gentoo/*) GEN=1; IG=1;;
                packaging/void/*) VOID=1; BV=1; IV=1;;
                packaging/install.sh|packaging/systemd/*|packaging/dracut/*|packaging/mkinitcpio/*) DEB=1; RPM=1; ARCH=1; GEN=1; VOID=1; BA=1; BV=1; BD=1; BF=1; IA=1; IV=1; IG=1;;
                tools/test-packaging.sh) DEB=1; RPM=1; ARCH=1; GEN=1; VOID=1;;
                tools/iso-arch-install.sh|tools/boot-arch-qemu.sh|tools/iso-guest-arch-setup.sh|tools/test-arch-install.sh) BA=1; IA=1;;
                tools/iso-void-install.sh|tools/boot-void-qemu.sh|tools/iso-guest-void-setup.sh|tools/test-void-install.sh) BV=1; IV=1;;
                tools/boot-debian-qemu.sh) BD=1;;
                tools/test-fedora-install.sh) BF=1;;
                tools/iso-gentoo-install.sh|tools/iso-guest-gentoo-setup.sh) IG=1;;
                *) force_full;;
              esac
            done;; esac
          fi
          # Outputs are the literal strings true/false: the job ifs
          # compare against 'true', and 0/1 never equals it (shipped once:
          # every scoped job silently skipped and the run went "green").
          t() { [ "$1" = 1 ] && echo true || echo false; }
          {
            echo "full=$(t "$FULL")"; echo "deb=$(t "$DEB")"; echo "rpm=$(t "$RPM")"
            echo "arch=$(t "$ARCH")"; echo "gentoo=$(t "$GEN")"; echo "void=$(t "$VOID")"
            echo "boot_arch=$(t "$BA")"; echo "boot_void=$(t "$BV")"
            echo "boot_debian=$(t "$BD")"; echo "boot_fedora=$(t "$BF")"
            echo "iso_arch=$(t "$IA")"; echo "iso_void=$(t "$IV")"; echo "iso_gentoo=$(t "$IG")"
          } >> "$GITHUB_OUTPUT"
          echo "scope: full=$FULL deb=$DEB rpm=$RPM arch=$ARCH gentoo=$GEN void=$VOID"

  # Load-bearing docs gate (AGENTS.md §1.8): broken doc links or man-page
  # syntax fail the build here in under a minute, on every push.
  docs-gate:
    needs: [scope]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: repo hygiene
        run: bash tools/check-repo-hygiene.sh
      - name: man page syntax (EN+RU)
        run: |
          command -v groff >/dev/null || sudo apt-get install -y -qq groff
          fail=0
          for f in packaging/man/*.[178] packaging/man/ru/*.[178]; do
            out=$(groff -z -man "$f" 2>&1) || true
            if [ -n "$out" ]; then echo "groff: $f: $out"; fail=1; fi
          done
          exit $fail

  engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      # fetch-depth 0 so TAGS are present. Without them `git describe` degrades
      # to a bare commit hash, VERSION inside the release artifact becomes the
      # hash instead of v0.6.0, and three separate checks then fail for what is
      # really one cause:
      #
      #   gentoo   .ebuild path invfs-<hash>.ebuild does not exist -> rc=127
      #   debian   .deb Version=0.6.0-1 does not match <hash>
      #   sig      the SHA256SUMS assertion, downstream of the same mismatch
      #
      # Locally this never shows, because a working tree has its tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          sudo apt-get update -qq
          # WP205: qemu-utils is not optional for the unit gate. invf-plugin_mt_test
          # builds its qcow2 fixture with qemu-img + qemu-io and was never able to
          # run here -- the test skipped itself, so the 4-thread IPC leg went
          # unmeasured and nothing said so. It skips again if these are absent,
          # which is right, but CI should not be that host.
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev python3 qemu-utils

      - name: build
        run: make -j"$(nproc)"

      - name: repo hygiene
        run: bash tools/check-repo-hygiene.sh

      # Unit tests: the four make-test shards in parallel on the one
      # machine (`make -j4 test` fans the shard targets out; each command
      # still runs isolated via run-unit-isolated.sh). One checkout, one
      # build, ~1-2 min per test, all at once -- simpler than shard jobs
      # and just as fast on a 4-vCPU runner.
      - name: unit tests (4 parallel shards)
        run: make -j4 test TESTENV='INVFS_TEST_DEBUG=1'

      - name: engine e2e suites
        run: |
          set -u
          mkdir -p .ci-tools /tmp/invfs-e2e
          SUITES="test-meta test-meta-delta test-meta-dirent test-meta-fold \
                  test-meta-fsck test-meta-hardlink test-meta-inode \
                  test-meta-multidev test-meta-mut test-meta-overlay \
                  test-meta-recipe test-meta-write test-meta-xattr"
          FAIL=0
          for s in $SUITES; do
            if [ ! -f "tools/$s.sh" ]; then
              echo "error: tools/$s.sh not found!"
              FAIL=1
              continue
            fi
            # relocate dev/shm to disk to keep CI tmpfs bounded
            sed 's|/dev/shm|/tmp/invfs-e2e|g' "tools/$s.sh" > ".ci-tools/$s.sh"
            echo "::group::$s"
            if bash ".ci-tools/$s.sh"; then
              echo "$s: PASS"
            else
              echo "$s: FAIL"; FAIL=1
            fi
            echo "::endgroup::"
            rm -rf /tmp/invfs-e2e
            mkdir -p /tmp/invfs-e2e
          done
          [ "$FAIL" = 0 ] || { echo "engine e2e: at least one suite FAILED"; exit 1; }
          echo "engine e2e: ALL SUITES PASS"
  # NOTE: there is deliberately no plain `packaging` job. The full
  # test-packaging.sh suite (all targets staged + sig negative controls)
  # already runs inside each native packaging-* job, so a fifth run only
  # duplicated them. Each installation below gates on its MATCHING native
  # packaging job instead of a shared staged gate.

  # Full FUSE e2e gate: every `make e2e` suite (the list is extracted from
  # the Makefile, so it cannot drift), plus the multidev chaos leg (not in
  # `make e2e`). Skipped, with reasons: the two known-reds (test-resize A6
  # pre-war, test-qcow2-zlib stale expectation -- both tracked, neither
  # caused by this tree), test-packaging (covered natively by the five
  # packaging jobs; would need debhelper too), and the cjxl-version-pinned
  # lanes (jxl/pngflac/rawimg/exercarve/sandbox: noble ships cjxl 0.7,
  # the lanes are built against 0.11 -- they gate locally; follow-up is a
  # cached libjxl build). This job builds the tree itself: the suites are
  # white-box on build products (build/core_objs.txt, cc-built fixtures),
  # so a bins-only artifact cannot feed them. Per-suite timeout so one
  # wedged suite cannot eat the job.
  e2e-full:
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true'
    # 24.04, not 22.04: libjxl-tools (cjxl/djxl, hard-required by the
    # jxl/exercarve/pngflac/rawimg lanes) is not installable on the 22.04
    # image. The version split is coverage, not drift: engine still gates
    # on 22.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev fuse3 zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 qemu-utils acl
          sudo add-apt-repository -y universe >/dev/null 2>&1 || true
          sudo apt-get update -qq || true
          for p in libjxl-tools p7zip-full; do
            sudo apt-get install -y -qq "$p" \
              || echo "::warning::$p unavailable on this image (some suites degrade)"
          done
          sudo apt-get install -y -qq python3-numpy python3-pil exfatprogs mtools 2>/dev/null \
            || echo "::warning::numpy/PIL/exfat/mtools unavailable (jxl/pngflac/fatfs degrade)"
          grep -q "^user_allow_other" /etc/fuse.conf \
            || echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: build
        run: make -j"$(nproc)" && make helpers && make test-bins
      - name: full e2e (minus known reds) + multidev
        run: |
          export INVFS_CODECPACKS_SYS=0
          export PATH="$PATH:/sbin:/usr/sbin"
          # cjxl 0.7 (noble) vs 0.11 (dev box): the JXL lanes are
          # tool-version-pinned (transcode counts differ), so they gate
          # locally where the new toolchain lives, not here. Follow-up:
          # cache a built libjxl and un-skip.
          # fuzz bitflip setup (WP301), usr1 leg A (WP302),
          # fuse-sweep-thread pid-scan + ext4fs orphan pin (WP305):
          # fixed, un-skipped 2026-10-11 (were triage reds, see INCIDENTS).
          SKIP="test-resize.sh test-qcow2-zlib.sh test-packaging.sh test-jxl.sh test-pngflac.sh test-rawimg.sh test-exercarve.sh test-sandbox.sh"
          FAIL=0
          for s in $(make -n e2e | grep -o 'tools/test-[a-z0-9-]*\.sh' | sort -u) tools/test-flakey-multidev.sh; do
            base="${s##*/}"
            case " $SKIP " in *" $base "*) echo "SKIP (known red, tracked): $base"; continue;; esac
            echo "::group::$base"
            if timeout 1800 bash tools/run-e2e.sh "$s"; then echo "$base: PASS"; else echo "$base: FAIL"; FAIL=1; fi
            echo "::endgroup::"
          done
          [ "$FAIL" = 0 ] || { echo "e2e-full: at least one suite FAILED"; exit 1; }
          echo "e2e-full: ALL SUITES PASS"

  # Chaos soak, informational only (continue-on-error): the power-loss /
  # unstable-device storm has known pre-war reds and D-state hang modes
  # that need a human, not a gate. Builds the tree itself, same white-box
  # reason as e2e-full (it compiles orphan_test mid-run).
  soak-flakey:
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev fuse3 zlib1g-dev libzstd-dev zstd xz-utils curl python3
      - name: build
        run: make -j"$(nproc)" && make helpers
      - name: flakey soak (informational)
        run: |
          export INVFS_CODECPACKS_SYS=0
          export PATH="$PATH:/sbin:/usr/sbin"
          # the suite's scratch defaults to /srv/invfs-flakey (box
          # convention); runners use their temp dir via the suite's own
          # FLAKEY_WORK override instead.
          export FLAKEY_WORK="$RUNNER_TEMP/flakey"
          # Runner executes steps with `bash -e`: a bare `timeout ...; rc=$?`
          # dies on the timeout line itself when the suite fails, so rc is
          # never recorded and the artifact staging below is skipped. The
          # &&/|| shape survives -e on both paths.
          timeout 5400 bash tools/run-e2e.sh tools/test-flakey.sh && rc=0 || rc=$?
          echo "soak rc=$rc (informational; pre-war reds tracked, not gating)"
          echo "SOAK_RC=$rc" >> "$GITHUB_ENV"
          exit 0
      # The leg4 silent-MISMATCH incident (INCIDENTS.md) can only be
      # dissected with a failure artifact; stage it when the soak is red
      # so the next occurrence carries evidence. Always exit 0: the soak
      # stays informational, the artifact is the deliverable.
      - name: stage flakey failure artifacts
        if: env.SOAK_RC != '0'
        run: |
          mkdir -p "$RUNNER_TEMP/soak-artifacts"
          cp -r tools/flakey/artifacts "$RUNNER_TEMP/soak-artifacts/" 2>/dev/null || true
          du -sh "$RUNNER_TEMP/soak-artifacts" || true
      - uses: actions/upload-artifact@v4
        if: env.SOAK_RC != '0'
        with:
          name: soak-flakey-artifacts
          path: ${{ runner.temp }}/soak-artifacts
          if-no-files-found: ignore

  # The distro install harnesses, which build a real Arch and a real Void
  # root and take them through mkfs/import/fsck/verify/bit-exact reads.
  # Offline only (no boot, no FUSE) -- see the header of each script. Scratch
  # is pinned under RUNNER_TEMP so a 1.8 GB staging tree never lands on the
  # runner's small /tmp.
  installation-bootstrap-arch:
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.arch == 'true' || needs.scope.outputs.boot_arch == 'true'
    # DISABLED: the bootstrap-tarball path (test-arch-install.sh) tests the
    # same ground as the stock-ISO flow (archiso-validation) with less
    # realism for the same CI minutes. Re-enable by deleting this condition;
    # delete test-arch-install.sh outright once the ISO job is green twice.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
    # Arch root: offline volume build (mkfs/import/fsck/verify) plus
    # the single-device QEMU boot. Scratch pinned under RUNNER_TEMP.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: dependencies
        # WP224: this list was short in exactly the ways the suites are brittle
        # about, each found by RUNNING them rather than by reading them:
        #   fuse3           -- fusermount3 lives here; libfuse3-dev does NOT pull
        #                       it, and without it nothing can mount anything
        #   libjxl-tools    -- cjxl/djxl, which test-jxl.sh hard-requires
        #   p7zip-full      -- 7z/7za for the p7z and qcow2 fixtures
        #   qemu-system-x86 -- the BOOT harnesses below
        #   e2fsprogs xfsprogs dosfstools exfatprogs unzip zip
        #                    -- mkfs.* / debugfs / e2fsck / 7z: these install
        #                       into /sbin, which is on root's PATH and NOT on
        #                       a normal user's, so the suites could not find
        #                       their own tools
        #   python3-numpy python3-pil -- the fixture generators in test-jxl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev fuse3 zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 python3-numpy python3-pil debootstrap \
            e2fsprogs xfsprogs dosfstools exfatprogs unzip zip acl \
            debhelper devscripts
          # Best-effort: qemu for the boot harnesses, p7zip-full and
          # libjxl-tools for the e2e fixtures. The e2e PREFLIGHT is advisory by
          # design -- it reports missing tools rather than failing a run -- so a
          # runner image without these must not take the job down.
          #
          # ONE PACKAGE PER CALL, deliberately. `apt-get install a b c` installs
          # NOTHING when any single name is unavailable: one unknown package
          # aborts the whole transaction. So wrapping the full list in
          # `|| echo warning` was WORSE than no tolerance at all -- it silently
          # turned "one advisory tool is missing" into "no dependencies at all".
          # That is exactly how this job lost libfuse3-dev and then died at the
          # build step reporting "FAIL: build first (make)": make was fine, the
          # headers were not there.
          for p in libjxl-tools p7zip-full qemu-system-x86 qemu-utils; do
            sudo apt-get install -y -qq "$p" \
              || echo "::warning::$p unavailable on this image (advisory)"
          done
      - name: host capability preflight
        # One report of every gap instead of a sweep dying at the first one.
        run: bash tools/e2e-preflight.sh --quiet || true
      - name: "fuse: allow other users"   # quoted: a colon-space in an
        # unquoted YAML scalar makes the parser read this as a mapping key
        # test-acl.sh mounts with -o allow_other; without this the suite stops
        # with "/etc/fuse.conf needs user_allow_other".
        run: |
          sudo sh -c 'grep -q "^user_allow_other" /etc/fuse.conf \
            || echo user_allow_other >> /etc/fuse.conf'
          grep -v "^#" /etc/fuse.conf || true
      - name: build
        run: make -j"$(nproc)" && make helpers

      # A throwaway keypair for the Arch guest, so the boot uses publickey auth
      # instead of sshpass.
      #
      # sshpass drives the password prompt through a PSEUDO-TERMINAL, and the
      # runner's /dev/pts cannot allocate one -- sshpass answered "Failed to get
      # a pseudo terminal: No such device" hundreds of times while the guest was
      # up and its sshd was listening on 0.0.0.0:22. The harness already supports
      # ARCH_SSH_KEY and the provisioner already installs it as
      # /root/.ssh/authorized_keys; nothing was passing it, so the only path
      # exercised was the one that needs a pty.
      #
      # Generated BEFORE the volume build, because that step is what bakes the
      # authorized_keys into the image. Exported to GITHUB_ENV so the boot step
      # picks it up too. Disposable: this key only ever reaches a throwaway
      # volume on a runner that dies with the job.
      - name: throwaway ssh key for the Arch guest
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/arch_id"
          ssh-keygen -t ed25519 -N '' -C ci-arch -f "$K" >/dev/null
          echo "ARCH_SSH_KEY=$K" >> "$GITHUB_ENV"
          echo "::group::key generated at $K"
      - name: arch root -> InvariantFS volume
        run: |
          # KEEP=1: the volume has to survive for the boot step below.
          # Without it cleanup() removes $VOL on exit and the boot has nothing
          # to boot. It is sparse -- ~2 GB on disk for a 16 GB image.
          ARCH_WORK="$RUNNER_TEMP/arch" \
          KEEP=1 \
            bash tools/test-arch-install.sh

      - name: initramfs for the boot harnesses
        run: bash tools/mkinitramfs.sh

      - name: arch root BOOTS on InvariantFS (single device)
        run: |
          # The exit status is captured rather than allowed to propagate through
          # the pipe. With `set -o pipefail` a failing harness makes the PIPELINE
          # fail, and under `bash -e` the step aborts THERE -- so every line after
          # it, including the console copy, never runs. That is why Arch failures
          # arrived with no serial log at all: the one step that would show the
          # cause is the step being skipped BY the failure. Void looked fine
          # because it passes.
          set +e
          ARCH_WORK="$RUNNER_TEMP/arch" \
          ARCH_LOG=/tmp/invfs-arch-boot-single.log \
          ARCH_SSH_LOG=/tmp/invfs-arch-boot-single.ssh.log \
            bash tools/boot-arch-qemu.sh --single "$RUNNER_TEMP/arch/vol/single.img" \
              2>&1 | tee "$RUNNER_TEMP/archboot.log"
          rc=${PIPESTATUS[0]}
          set -e
          # The serial console is the evidence; keep it on failure.
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp /tmp/invfs-arch-boot-single.log /tmp/invfs-arch-boot-single.ssh.log \
            "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
          exit $rc

      # Void is back: it was green at 2675cbd and was only set aside while the
      # Arch boot -- the harness that had never succeeded anywhere -- was the
      # thing being chased. Arch now passes, so both run again.
      # Serial consoles are the evidence; kept per-distro so a
      # red job arrives with its own console to read.
      - name: upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-logs-arch
          path: |
            ${{ runner.temp }}/artifacts
            ${{ runner.temp }}/archboot.log
          if-no-files-found: ignore

  installation-bootstrap-void:
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.void == 'true' || needs.scope.outputs.boot_void == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
    # Void root: offline volume plus single- and two-device boots.
    # Scratch pinned under RUNNER_TEMP.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: dependencies
        # WP224: this list was short in exactly the ways the suites are brittle
        # about, each found by RUNNING them rather than by reading them:
        #   fuse3           -- fusermount3 lives here; libfuse3-dev does NOT pull
        #                       it, and without it nothing can mount anything
        #   libjxl-tools    -- cjxl/djxl, which test-jxl.sh hard-requires
        #   p7zip-full      -- 7z/7za for the p7z and qcow2 fixtures
        #   qemu-system-x86 -- the BOOT harnesses below
        #   e2fsprogs xfsprogs dosfstools exfatprogs unzip zip
        #                    -- mkfs.* / debugfs / e2fsck / 7z: these install
        #                       into /sbin, which is on root's PATH and NOT on
        #                       a normal user's, so the suites could not find
        #                       their own tools
        #   python3-numpy python3-pil -- the fixture generators in test-jxl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev fuse3 zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 python3-numpy python3-pil debootstrap \
            e2fsprogs xfsprogs dosfstools exfatprogs unzip zip acl \
            debhelper devscripts
          # Best-effort: qemu for the boot harnesses, p7zip-full and
          # libjxl-tools for the e2e fixtures. The e2e PREFLIGHT is advisory by
          # design -- it reports missing tools rather than failing a run -- so a
          # runner image without these must not take the job down.
          #
          # ONE PACKAGE PER CALL, deliberately. `apt-get install a b c` installs
          # NOTHING when any single name is unavailable: one unknown package
          # aborts the whole transaction. So wrapping the full list in
          # `|| echo warning` was WORSE than no tolerance at all -- it silently
          # turned "one advisory tool is missing" into "no dependencies at all".
          # That is exactly how this job lost libfuse3-dev and then died at the
          # build step reporting "FAIL: build first (make)": make was fine, the
          # headers were not there.
          for p in libjxl-tools p7zip-full qemu-system-x86 qemu-utils; do
            sudo apt-get install -y -qq "$p" \
              || echo "::warning::$p unavailable on this image (advisory)"
          done
      - name: host capability preflight
        # One report of every gap instead of a sweep dying at the first one.
        run: bash tools/e2e-preflight.sh --quiet || true
      - name: "fuse: allow other users"   # quoted: a colon-space in an
        # unquoted YAML scalar makes the parser read this as a mapping key
        # test-acl.sh mounts with -o allow_other; without this the suite stops
        # with "/etc/fuse.conf needs user_allow_other".
        run: |
          sudo sh -c 'grep -q "^user_allow_other" /etc/fuse.conf \
            || echo user_allow_other >> /etc/fuse.conf'
          grep -v "^#" /etc/fuse.conf || true
      - name: build
        run: make -j"$(nproc)" && make helpers

      # A throwaway keypair for the Arch guest, so the boot uses publickey auth
      # instead of sshpass.
      #
      # sshpass drives the password prompt through a PSEUDO-TERMINAL, and the
      # runner's /dev/pts cannot allocate one -- sshpass answered "Failed to get
      # a pseudo terminal: No such device" hundreds of times while the guest was
      # up and its sshd was listening on 0.0.0.0:22. The harness already supports
      # ARCH_SSH_KEY and the provisioner already installs it as
      # /root/.ssh/authorized_keys; nothing was passing it, so the only path
      # exercised was the one that needs a pty.
      #
      # Generated BEFORE the volume build, because that step is what bakes the
      # authorized_keys into the image. Exported to GITHUB_ENV so the boot step
      # picks it up too. Disposable: this key only ever reaches a throwaway
      # volume on a runner that dies with the job.
      - name: initramfs for the boot harnesses
        run: bash tools/mkinitramfs.sh

      - name: void root -> InvariantFS volume (offline)
        run: |
          INVFS_VOID_WORK="$RUNNER_TEMP/void" \
            bash tools/test-void-install.sh
      - name: void root BOOTS on InvariantFS (single device)
        run: |
          set -o pipefail
          rc=0
          INVFS_VOID_WORK="$RUNNER_TEMP/voidboot" \
          INVFS_VOID_LOGDIR="$RUNNER_TEMP/voidboot-logs" \
          INVFS_VOID_KEEP=0 \
          INVFS_VOID_SSH_TIMEOUT=600 \
            bash tools/boot-void-qemu.sh 2>&1 | tee "$RUNNER_TEMP/voidboot.log" || rc=${PIPESTATUS[0]}
          cp -r "$RUNNER_TEMP/voidboot-logs" "$RUNNER_TEMP/artifacts" 2>/dev/null || true
          exit $rc
      - name: void root BOOTS on InvariantFS (two devices)
        run: |
          set -o pipefail
          rc=0
          INVFS_VOID_MODE=multi \
          INVFS_VOID_WORK="$RUNNER_TEMP/voidboot2" \
          INVFS_VOID_LOGDIR="$RUNNER_TEMP/voidboot2-logs" \
          INVFS_VOID_KEEP=0 \
          INVFS_VOID_SSH_TIMEOUT=600 \
            bash tools/boot-void-qemu.sh 2>&1 | tee "$RUNNER_TEMP/voidboot2.log" || rc=${PIPESTATUS[0]}
          cp -r "$RUNNER_TEMP/voidboot2-logs" "$RUNNER_TEMP/artifacts" 2>/dev/null || true
          exit $rc

      # Debian: the third boot harness, and the only one that reaches
      # multi-user.target on systemd. Never in CI before -- every boot result in
      # this project has been Void's and Arch's until now.
      # configure-debian.sh takes the staged root as a POSITIONAL argument and
      # populates it; boot-debian-qemu.sh then either imports it (INVFS_DEB_STAGE)
      # or reuses a volume (INVFS_DEB_VOLUME). Written against the real interface
      # after first getting it wrong in a draft.
      # Serial consoles are the evidence; kept per-distro so a
      # red job arrives with its own console to read.
      - name: upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-logs-void
          path: |
            ${{ runner.temp }}/voidboot-logs
            ${{ runner.temp }}/voidboot2-logs
            ${{ runner.temp }}/artifacts
          if-no-files-found: ignore

  installation-bootstrap-debian:
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.deb == 'true' || needs.scope.outputs.boot_debian == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    # Debian root (systemd PID 1): debootstrap, provisioning, offline
    # import, then the single-device boot. Scratch under RUNNER_TEMP.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: dependencies
        # WP224: this list was short in exactly the ways the suites are brittle
        # about, each found by RUNNING them rather than by reading them:
        #   fuse3           -- fusermount3 lives here; libfuse3-dev does NOT pull
        #                       it, and without it nothing can mount anything
        #   libjxl-tools    -- cjxl/djxl, which test-jxl.sh hard-requires
        #   p7zip-full      -- 7z/7za for the p7z and qcow2 fixtures
        #   qemu-system-x86 -- the BOOT harnesses below
        #   e2fsprogs xfsprogs dosfstools exfatprogs unzip zip
        #                    -- mkfs.* / debugfs / e2fsck / 7z: these install
        #                       into /sbin, which is on root's PATH and NOT on
        #                       a normal user's, so the suites could not find
        #                       their own tools
        #   python3-numpy python3-pil -- the fixture generators in test-jxl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev fuse3 zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 python3-numpy python3-pil debootstrap \
            e2fsprogs xfsprogs dosfstools exfatprogs unzip zip acl \
            debhelper devscripts
          # Best-effort: qemu for the boot harnesses, p7zip-full and
          # libjxl-tools for the e2e fixtures. The e2e PREFLIGHT is advisory by
          # design -- it reports missing tools rather than failing a run -- so a
          # runner image without these must not take the job down.
          #
          # ONE PACKAGE PER CALL, deliberately. `apt-get install a b c` installs
          # NOTHING when any single name is unavailable: one unknown package
          # aborts the whole transaction. So wrapping the full list in
          # `|| echo warning` was WORSE than no tolerance at all -- it silently
          # turned "one advisory tool is missing" into "no dependencies at all".
          # That is exactly how this job lost libfuse3-dev and then died at the
          # build step reporting "FAIL: build first (make)": make was fine, the
          # headers were not there.
          for p in libjxl-tools p7zip-full qemu-system-x86 qemu-utils; do
            sudo apt-get install -y -qq "$p" \
              || echo "::warning::$p unavailable on this image (advisory)"
          done
      - name: host capability preflight
        # One report of every gap instead of a sweep dying at the first one.
        run: bash tools/e2e-preflight.sh --quiet || true
      - name: "fuse: allow other users"   # quoted: a colon-space in an
        # unquoted YAML scalar makes the parser read this as a mapping key
        # test-acl.sh mounts with -o allow_other; without this the suite stops
        # with "/etc/fuse.conf needs user_allow_other".
        run: |
          sudo sh -c 'grep -q "^user_allow_other" /etc/fuse.conf \
            || echo user_allow_other >> /etc/fuse.conf'
          grep -v "^#" /etc/fuse.conf || true
      - name: build
        run: make -j"$(nproc)" && make helpers

      # A throwaway keypair for the Arch guest, so the boot uses publickey auth
      # instead of sshpass.
      #
      # sshpass drives the password prompt through a PSEUDO-TERMINAL, and the
      # runner's /dev/pts cannot allocate one -- sshpass answered "Failed to get
      # a pseudo terminal: No such device" hundreds of times while the guest was
      # up and its sshd was listening on 0.0.0.0:22. The harness already supports
      # ARCH_SSH_KEY and the provisioner already installs it as
      # /root/.ssh/authorized_keys; nothing was passing it, so the only path
      # exercised was the one that needs a pty.
      #
      # Generated BEFORE the volume build, because that step is what bakes the
      # authorized_keys into the image. Exported to GITHUB_ENV so the boot step
      # picks it up too. Disposable: this key only ever reaches a throwaway
      # volume on a runner that dies with the job.
      - name: initramfs for the boot harnesses
        run: bash tools/mkinitramfs.sh

      - name: debian root -> InvariantFS volume
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/debian"
          mkdir -p "$S"
          # configure-debian.sh provisions an EXISTING Debian root (it
          # exits 1 unless sbin/init or lib/systemd is present) and
          # installs no packages itself, so the root has to be created
          # first. debootstrap a minbase with the boot-required packages
          # (docs/DEBIAN-INSTALL.md §1 table: systemd, dbus, udev,
          # openssh-server -- udev ships separately from systemd).
          sudo debootstrap --variant=minbase \
            --include=systemd,dbus,udev,openssh-server \
            trixie "$S"
          sudo chown -R "$(id -u):$(id -g)" "$S"
          bash tools/configure-debian.sh "$S"
          # DIAGNOSTIC (saga layer 3): 600 s poweroff budget on this step
          # only, to discriminate daemon-grinding-slowly (powers down at
          # ~400 s) from writeback-wedged (identical D-state stall past
          # 600 s). Script default stays 300. Revisit once WP626 concludes:
          # slow -> accept/document or speed up (own WP); stuck -> the
          # request-tracing fix lands and this override goes away.
          INVFS_DEB_BOOT_TIMEOUT=2100 \
          INVFS_DEB_POWEROFF_TIMEOUT=600 \
          INVFS_DEB_POWEROFF_SILENCE_TIMEOUT=600 \
          INVFS_DEB_SHUTDOWN_DEBUG=1 \
          INVFS_DEB_STAGE="$S" bash tools/boot-debian-qemu.sh
      - name: debian root BOOTS on InvariantFS (single device)
        run: |
          set -o pipefail
          rc=0
          # TCG boots on shared runners vary 13-16+ min wall; the script's
          # 900 s default turns variance into red. 2100 s still catches a
          # true hang (which never finishes) while surviving slow hosts.
          # DIAGNOSTIC: 1200 s qemu-exit budget (script default 600) to
          # tell a slow TCG poweroff tail (exits late) from a wedged guest
          # (never exits). Revisit once the verdict is in: slow -> keep or
          # document; wedged -> root-cause instead of a bigger number.
          INVFS_DEB_BOOT_TIMEOUT=2100 \
          INVFS_DEB_POWEROFF_TIMEOUT=600 \
          INVFS_DEB_POWEROFF_SILENCE_TIMEOUT=600 \
          INVFS_DEB_QEMU_EXIT_TIMEOUT=1200 \
          INVFS_DEB_SHUTDOWN_DEBUG=1 \
          INVFS_DEB_STAGE="$RUNNER_TEMP/debian" \
            bash tools/boot-debian-qemu.sh \
              2>&1 | tee "$RUNNER_TEMP/debianboot.log" || rc=${PIPESTATUS[0]}
          cp /tmp/invfs-debian-boot-single.log "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
          exit $rc
      # WP621: the serial console is the evidence, and on a red step 8 the
      # tee above never runs (skipped) while the upload below only knows
      # runner.temp paths -- the failed run arrived with no console to read.
      # This rescue runs always and collects every known serial location.
      - name: rescue serial logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp /var/tmp/invfs-deb-boot-logs/serial.log "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
          cp /tmp/invfs-debian-boot-single.log "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
          ls "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
      # Serial consoles are the evidence; kept per-distro so a
      # red job arrives with its own console to read.
      - name: upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-logs-debian
          path: |
            ${{ runner.temp }}/artifacts
            ${{ runner.temp }}/debianboot.log
          if-no-files-found: ignore

  # Fedora root (offline only for now): pinned Container-Base-Minimal OCI
  # tarball, hash-verified, layer-extracted, offline import (single +
  # two-device), fsck clean, bit-exact reads. No boot yet -- that needs
  # boot-fedora-qemu.sh, which does not exist. Scratch under RUNNER_TEMP.
  installation-bootstrap-fedora:
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.rpm == 'true' || needs.scope.outputs.boot_fedora == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev fuse3 zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3
      - name: build
        run: make -j"$(nproc)" && make helpers
      - name: fedora root -> InvariantFS volume (offline)
        run: |
          INVFS_FEDORA_WORK="$RUNNER_TEMP/fedora" \
            bash tools/test-fedora-install.sh
  packaging-fedora:
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.rpm == 'true'
    runs-on: ubuntu-22.04
    container: fedora:latest
    timeout-minutes: 40
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-v1-fedora-${{ hashFiles('Makefile', 'src/**/*.c', 'src/**/*.h', 'tools/codecpacks/**/*.c') }}
          restore-keys: |
            ccache-v1-fedora-

      - name: dependencies
        run: |
          dnf install -y gcc make pkgconf-pkg-config fuse3-devel zlib-devel \
            libzstd-devel systemd-rpm-macros rpm-build ccache python3 git \
            tar gzip file awk findutils

      - name: build
        run: |
          ccache --zero-stats >/dev/null 2>&1 || true
          ccache --max-size=1G >/dev/null 2>&1 || true
          CC="ccache gcc" make -j"$(nproc)" && CC="ccache gcc" make helpers
          ccache --show-stats || true

      - name: packaging suite (rpm native)
        run: bash tools/test-packaging.sh

  # Gentoo: a real emerge of the ebuild against the HEAD-built artifact.
  # The ebuild installs prebuilt binaries (no BUILD_DEPENDS); the RDEPENDs
  # come from the official binhost so nothing compiles but our own tree
  # (built by `make release` below). Distfiles are staged locally and the
  # Manifest regenerated -- the ebuild's BLAKE2B/SIZE pins are provenance
  # notes, portage's Manifest does the real verification.
  packaging-gentoo:
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.gentoo == 'true'
    runs-on: ubuntu-22.04
    container: gentoo/stage3:latest
    timeout-minutes: 60
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: portage snapshot (webrsync, not a full git sync)
        run: |
          # Fresh stage3 ships repos.conf pointing at /var/db/repos/gentoo
          # but not the directory; portage validates the location before
          # it can populate it, so create it first.
          mkdir -p /var/db/repos/gentoo
          emerge-webrsync -q || emerge --sync -q

      - name: build the release artifact this ebuild will install
        run: |
          emerge -g -q app-arch/zstd sys-libs/zlib sys-fs/fuse:3 || emerge -q app-arch/zstd sys-libs/zlib sys-fs/fuse:3
          make -j"$(nproc)" && make release

      - name: local overlay with HEAD distfiles
        run: |
          set -euo pipefail
          ART=$(ls -t dist/invfs-*-x86_64.tar.zst | head -1)
          VER=$(cut -d- -f2 <<<"$(basename "$ART")")
          PV=${VER#v}
          OVERLAY=/var/db/repos/invfs-local
          mkdir -p "$OVERLAY/metadata" "$OVERLAY/sys-apps/invfs" "$OVERLAY/profiles"
          echo 'masters = gentoo' > "$OVERLAY/metadata/layout.conf"
          echo 'invfs-local' > "$OVERLAY/profiles/repo_name"
          mkdir -p /etc/portage/repos.conf
          printf '[invfs-local]\nlocation = %s\n' "$OVERLAY" > /etc/portage/repos.conf/invfs-local.conf
          cp "packaging/gentoo/invfs-$PV.ebuild" "$OVERLAY/sys-apps/invfs/" || cp packaging/gentoo/invfs-*.ebuild "$OVERLAY/sys-apps/invfs/"
          EB=$(ls "$OVERLAY/sys-apps/invfs"/invfs-*.ebuild | head -1)
          cp "$ART" dist/SHA256SUMS "$(portageq envvar DISTDIR)/"
          ( cd "$OVERLAY/sys-apps/invfs" && ebuild "$(basename "$EB")" manifest )
          mkdir -p /etc/portage/package.accept_keywords
          echo 'sys-apps/invfs ~amd64' >> /etc/portage/package.accept_keywords/invfs

      - name: emerge from the overlay, verify the install
        run: |
          set -euo pipefail
          EMERGE_DEFAULT_OPTS="--getbinpkg --usepkg" emerge -g -q sys-apps/invfs
          invf-mkfs --version

  # Stock-Arch-ISO install onto InvariantFS. Boots the pinned, checksummed
  # ISO pristine and fetches everything InvFS-specific from a local server
  # (recipe + release artifact + guest script); the guest makepkgs,
  # pacman -Us, pacstraps, images, verifies, and must print PASS and power
  # off. No KVM on runners: the driver falls back to TCG (slow), hence the
  # generous timeout. See tools/iso-arch-install.sh.
  installation-iso-arch:
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.arch == 'true' || needs.scope.outputs.iso_arch == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 qemu-system-x86 qemu-utils

      - name: build
        run: make -j"$(nproc)"

      - name: arch ISO install onto InvFS
        run: |
          WORK="$RUNNER_TEMP/iso" bash tools/iso-arch-install.sh

      # Post-installation proof: boot the just-imaged volume the same way
      # the (disabled) bootstrap job did. The ISO guest provisions
      # busybox-init + root pw + host keys for exactly this.
      - name: initramfs for the boot harness
        run: bash tools/mkinitramfs.sh

      - name: installed arch BOOTS on InvariantFS
        run: |
          set +e
          ARCH_WORK="$RUNNER_TEMP/archboot" \
          ARCH_LOG=/tmp/invfs-archboot.log \
          ARCH_SSH_LOG=/tmp/invfs-archboot.ssh.log \
            bash tools/boot-arch-qemu.sh --single "$RUNNER_TEMP/iso/vol.img" \
              2>&1 | tee "$RUNNER_TEMP/archboot.log"
          rc=${PIPESTATUS[0]}
          set -e
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp /tmp/invfs-archboot.log /tmp/invfs-archboot.ssh.log \
            "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
          exit $rc

      # The guest serial + serve log are the only evidence when the marker
      # never comes; without them a failed run is undebuggable (the driver
      # only prints its own lines, the guest's stay on the runner).
      # The guest serial + serve log are the only evidence when the marker
      # never comes; without them a failed run is undebuggable (the driver
      # only prints its own lines, the guest's stay on the runner).
      # Boot-phase consoles ride along too (see the boot step above).
      - name: upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-install-logs
          path: |
            ${{ runner.temp }}/iso/serial.log
            ${{ runner.temp }}/iso/serve.log
            ${{ runner.temp }}/artifacts
          if-no-files-found: warn

  # Stock-Void-ISO install onto InvariantFS. Boots the pinned, checksummed
  # ISO's kernel+initramfs pristine, breaks to the dracut debug shell
  # (rd.break=pre-pivot, driven over a bidirectional serial pipe), chroots
  # into the live root and runs the Handbook XBPS-method install
  # (xbps-install -r base-system) onto the volume: mkfs, batched import,
  # fsck, bit-exact spot checks, PASS, poweroff. No KVM on runners: the
  # driver falls back to TCG (slow), hence the generous timeout. See
  # tools/iso-void-install.sh. No void-installer TUI is driven anywhere.
  installation-iso-void:
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.void == 'true' || needs.scope.outputs.iso_void == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 qemu-system-x86 qemu-utils e2fsprogs

      - name: build
        run: make -j"$(nproc)"

      - name: void ISO install onto InvFS
        run: |
          WORK="$RUNNER_TEMP/iso-void" bash tools/iso-void-install.sh

      # Same evidence rationale as the Arch ISO job above.
      - name: upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-void-install-logs
          path: |
            ${{ runner.temp }}/iso-void/serial.log
            ${{ runner.temp }}/iso-void/serve.log
          if-no-files-found: warn

  # Stock-Gentoo-minimal-ISO install onto InvariantFS. Boots the pinned,
  # checksummed ISO's kernel+initramfs pristine with the Handbook's own
  # unattended-install pair (dosshd + passwd=), SSHes in and runs the
  # Handbook stage3 install (pinned stage3 + SHA512): unpack, minimal
  # config, mkfs, batched import, fsck, bit-exact spot checks, PASS,
  # poweroff. No KVM on runners: the driver falls back to TCG (slow),
  # hence the generous timeout. See tools/iso-gentoo-install.sh. Gentoo
  # has no installer TUI; the Handbook install IS the CLI flow.
  installation-iso-gentoo:
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.gentoo == 'true' || needs.scope.outputs.iso_gentoo == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 qemu-system-x86 qemu-utils sshpass e2fsprogs

      - name: build
        run: make -j"$(nproc)"

      - name: gentoo ISO install onto InvFS
        run: |
          WORK="$RUNNER_TEMP/iso-gentoo" bash tools/iso-gentoo-install.sh

      # Same evidence rationale as the Arch ISO job above.
      - name: upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-gentoo-install-logs
          path: |
            ${{ runner.temp }}/iso-gentoo/serial.log
            ${{ runner.temp }}/iso-gentoo/serve.log
            ${{ runner.temp }}/iso-gentoo/ssh.log
          if-no-files-found: warn

  # Debian, natively: the same dpkg-buildpackage the matrix runs, but on
  # the real Debian toolchain instead of Ubuntu's. Full suite (foreign
  # legs skip, staged legs run, debian leg native).
  packaging-debian:
    runs-on: ubuntu-22.04
    container: debian:bookworm
    timeout-minutes: 40
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.deb == 'true'
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential pkg-config git \
            libfuse3-dev zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 file gawk gzip debhelper devscripts \
            ca-certificates

      - name: build
        run: make -j"$(nproc)" && make helpers

      - name: packaging suite (deb native)
        run: bash tools/test-packaging.sh

  # Arch, natively: full suite in an Arch container (arch leg staged as
  # elsewhere) PLUS a real makepkg of the recipe against the
  # HEAD-built artifact -- the exact proof the staged leg cannot give
  # (it executes package(), never makepkg: the sha256sums filename bug
  # lived there). Containers run as root but makepkg refuses root (and
  # current pacman removed --asroot), so the build runs as a builder user.
  packaging-arch:
    runs-on: ubuntu-22.04
    container: archlinux:base
    timeout-minutes: 40
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.arch == 'true'
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          pacman -Sy --needed --noconfirm gcc make pkgconf fuse3 zstd zlib \
            python3 tar gzip file awk fakeroot libarchive git

      - name: build
        run: make -j"$(nproc)" && make helpers

      - name: packaging suite (arch staged)
        run: bash tools/test-packaging.sh

      - name: real makepkg of the recipe
        run: |
          set -euo pipefail
          ART=$(ls -t dist/invfs-*-x86_64.tar.zst | head -1)
          D=/tmp/archpkg; rm -rf "$D"; mkdir -p "$D"
          cp packaging/PKGBUILD dist/SHA256SUMS "$ART" "$D/"
          cd "$D"
          H=$(cut -d' ' -f1 SHA256SUMS)
          sed -i "s/'[0-9a-f]\{64\}'/'$H'/" PKGBUILD
          # makepkg refuses root and current pacman removed --asroot:
          # build as an unprivileged user instead (HOME + cwd are his).
          id builder >/dev/null 2>&1 || useradd -m builder
          chown -R builder:builder "$D"
          runuser -u builder -- makepkg --noconfirm
          ls invfs-*.pkg.tar.zst
          pacman -Qip invfs-*.pkg.tar.zst | head -5

  # Void, natively: real xbps-src build of the template against the
  # HEAD-built artifact (staged do_install() runs inside the suite too).
  # xbps-src wants its void-packages tree: shallow clone + binary
  # bootstrap, then a local srcpkgs overlay with re-pinned distfiles
  # (same test-staging shape as the Gentoo job).
  packaging-void:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      # xbps-src builds as non-root inside user+mount namespaces and bind-
      # mounts /proc into its masterdir: needs real privilege, seccomp-
      # unconfined was not enough (bind mount denied).
      options: --privileged
    timeout-minutes: 90
    needs: [scope, engine]
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.void == 'true'
    # ethereal chroot style: the DOCUMENTED Docker flow (common/chroot-style
    # README). No namespaces, no mounts: symlinks emulate the chroot, the
    # container root is the masterdir, and BREAKOUT lets root run it all.
    # Disposable container; the symlinks die with it.
    env:
      XBPS_CHROOT_CMD: ethereal
      XBPS_ALLOW_CHROOT_BREAKOUT: "yes"
    # The full image ships no bash, so the runner falls back to sh and
    # every `set -euo pipefail` step dies with "Illegal option". The
    # bootstrap step installs bash under sh; everything after runs bash.
    defaults:
      run:
        shell: bash {0}
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: bootstrap bash (no bash in the image; runner falls back to sh)
        shell: sh {0}
        run: xbps-install -Sy bash

      - name: toolchain + void-packages tree
        run: |
          set -euo pipefail
          # No xbps-src binary here: the package is absent from the repo
          # pool in this image, and the git clone + binary-bootstrap below
          # is the self-sufficient documented path (it fetches its own
          # static toolchain).
          xbps-install -Syu git base-devel pkg-config \
            fuse3-devel zlib-devel libzstd-devel zstd python3 tar \
            gzip curl file 2>&1 | tail -2
          [ -d /tmp/vp ] || git clone --depth 1 https://github.com/void-linux/void-packages /tmp/vp
          cd /tmp/vp && ./xbps-src binary-bootstrap
          # ethereal model: swap the bootstrapped masterdir for a symlink
          # to / (the container root, which already carries base-devel).
          # NOTE the name: under ethereal the default masterdir is plain
          # 'masterdir', not 'masterdir-<arch>'. Remove by existence, not
          # by glob (an unmatched glob plus set -e aborts the step; an
          # existing dir makes ln try to link *inside* it and fail).
          for d in /tmp/vp/masterdir /tmp/vp/masterdir-*/; do
            [ -e "$d" ] || [ -L "$d" ] || continue
            rm -rf "$d"
          done
          ln -s / /tmp/vp/masterdir

      - name: build
        run: make -j"$(nproc)" && make helpers

      - name: packaging suite (void staged)
        run: bash tools/test-packaging.sh

      - name: real xbps-src build of the template
        run: |
          set -euo pipefail
          ART=$(ls -t dist/invfs-*-x86_64.tar.zst | head -1)
          OVER=/tmp/vp/srcpkgs/invfs
          mkdir -p "$OVER"
          cp packaging/void/template "$OVER/template"
          # The overlay copy tracks the just-built artifact, not the
          # committed template: version skew (template re-pinned only at
          # release time) used to point distfiles at the published older
          # tarball while checksum= was re-pinned to the local build -- a
          # guaranteed mismatch. Bump version= in the overlay only.
          BUILT_VER=$(tar --zstd -xOf "$ART" --wildcards '*/VERSION' | head -1 | sed 's/^v//')
          sed -i "s/^version=.*/version=$BUILT_VER/" "$OVER/template"
          # xbps-src looks for distfiles at
          # hostdir/sources/<pkgname>-<version>/ (00-distfiles.sh:
          # srcdir=$XBPS_SRCDISTDIR/$pkgname-$version); anything else is
          # invisible and triggers a real fetch.
          SRCDIST=/tmp/vp/hostdir/sources/invfs-$BUILT_VER
          mkdir -p "$SRCDIST"
          cp "$ART" "$SRCDIST/"
          H=$(cut -d' ' -f1 dist/SHA256SUMS)
          sed -i "s/^checksum=.*/checksum=$H/" "$OVER/template"
          grep -q "^checksum=$H$" "$OVER/template" || { echo "re-pin failed"; exit 1; }
          cd /tmp/vp && ./xbps-src pkg invfs
          ls hostdir/binpkgs/invfs-*.xbps
