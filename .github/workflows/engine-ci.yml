      # A throwaway keypair for the Arch guest, so the boot uses publickey auth
      # instead of sshpass.
      #
      # sshpass drives the password prompt through a PSEUDO-TERMINAL, and the
      # runner's /dev/pts cannot allocate one -- sshpass answered "Failed to get
