        #   p7zip-full      -- 7z/7za for the p7z and qcow2 fixtures
        #   qemu-system-x86 -- the BOOT harnesses below
        #   e2fsprogs xfsprogs dosfstools exfatprogs unzip zip
        #                    -- mkfs.* / debugfs / e2fsck / 7z: these install
        #                       into /sbin, which is on root's PATH and NOT on
