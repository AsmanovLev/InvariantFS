        # test-acl.sh mounts with -o allow_other; without this the suite stops
        # with "/etc/fuse.conf needs user_allow_other".
        run: |
          sudo sh -c 'grep -q "^user_allow_other" /etc/fuse.conf \
            || echo user_allow_other >> /etc/fuse.conf'
          grep -v "^#" /etc/fuse.conf || true
      - name: build
        run: make -j"$(nproc)" && make helpers

      # A throwaway keypair for the Arch guest, so the boot uses publickey auth
      # instead of sshpass.
      #
      # sshpass drives the password prompt through a PSEUDO-TERMINAL, and the
      # runner's /dev/pts cannot allocate one -- sshpass answered "Failed to get
      # a pseudo terminal: No such device" hundreds of times while the guest was
      # up and its sshd was listening on 0.0.0.0:22. The harness already supports
      # ARCH_SSH_KEY and the provisioner already installs it as
      # /root/.ssh/authorized_keys; nothing was passing it, so the only path
      # exercised was the one that needs a pty.
      #
      # Generated BEFORE the volume build, because that step is what bakes the
      # authorized_keys into the image. Exported to GITHUB_ENV so the boot step
      # picks it up too. Disposable: this key only ever reaches a throwaway
      # volume on a runner that dies with the job.
      - name: initramfs for the boot harnesses
        run: bash tools/mkinitramfs.sh

      - name: void root -> InvariantFS volume (offline)
        run: |
          INVFS_VOID_WORK="$RUNNER_TEMP/void" \
            bash tools/test-void-install.sh
      - name: void root BOOTS on InvariantFS (single device)
        run: |
          set -o pipefail
          rc=0
          INVFS_VOID_WORK="$RUNNER_TEMP/voidboot" \
          INVFS_VOID_LOGDIR="$RUNNER_TEMP/voidboot-logs" \
          INVFS_VOID_KEEP=0 \
            bash tools/boot-void-qemu.sh 2>&1 | tee "$RUNNER_TEMP/voidboot.log" || rc=${PIPESTATUS[0]}
          cp -r "$RUNNER_TEMP/voidboot-logs" "$RUNNER_TEMP/artifacts" 2>/dev/null || true
          exit $rc
      - name: void root BOOTS on InvariantFS (two devices)
        run: |
          set -o pipefail
          rc=0
          INVFS_VOID_MODE=multi \
          INVFS_VOID_WORK="$RUNNER_TEMP/voidboot2" \
          INVFS_VOID_LOGDIR="$RUNNER_TEMP/voidboot2-logs" \
          INVFS_VOID_KEEP=0 \
            bash tools/boot-void-qemu.sh 2>&1 | tee "$RUNNER_TEMP/voidboot2.log" || rc=${PIPESTATUS[0]}
          cp -r "$RUNNER_TEMP/voidboot2-logs" "$RUNNER_TEMP/artifacts" 2>/dev/null || true
          exit $rc

      # Debian: the third boot harness, and the only one that reaches
      # multi-user.target on systemd. Never in CI before -- every boot result in
      # this project has been Void's and Arch's until now.
      # configure-debian.sh takes the staged root as a POSITIONAL argument and
      # populates it; boot-debian-qemu.sh then either imports it (INVFS_DEB_STAGE)
      # or reuses a volume (INVFS_DEB_VOLUME). Written against the real interface
      # after first getting it wrong in a draft.
      # Serial consoles are the evidence; kept per-distro so a
      # red job arrives with its own console to read.
      - name: upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-logs-void
          path: |
            ${{ runner.temp }}/voidboot-logs
            ${{ runner.temp }}/voidboot2-logs
            ${{ runner.temp }}/artifacts
          if-no-files-found: ignore

  installation-bootstrap-debian:
    needs: [engine, packaging-debian]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    # Debian root (systemd PID 1): debootstrap, provisioning, offline
    # import, then the single-device boot. Scratch under RUNNER_TEMP.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: dependencies
        # WP224: this list was short in exactly the ways the suites are brittle
        # about, each found by RUNNING them rather than by reading them:
        #   fuse3           -- fusermount3 lives here; libfuse3-dev does NOT pull
        #                       it, and without it nothing can mount anything
        #   libjxl-tools    -- cjxl/djxl, which test-jxl.sh hard-requires
        #   p7zip-full      -- 7z/7za for the p7z and qcow2 fixtures
        #   qemu-system-x86 -- the BOOT harnesses below
        #   e2fsprogs xfsprogs dosfstools exfatprogs unzip zip
        #                    -- mkfs.* / debugfs / e2fsck / 7z: these install
        #                       into /sbin, which is on root's PATH and NOT on
        #                       a normal user's, so the suites could not find
        #                       their own tools
        #   python3-numpy python3-pil -- the fixture generators in test-jxl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev fuse3 zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 python3-numpy python3-pil debootstrap \
            e2fsprogs xfsprogs dosfstools exfatprogs unzip zip acl \
            debhelper devscripts
          # Best-effort: qemu for the boot harnesses, p7zip-full and
          # libjxl-tools for the e2e fixtures. The e2e PREFLIGHT is advisory by
          # design -- it reports missing tools rather than failing a run -- so a
          # runner image without these must not take the job down.
          #
          # ONE PACKAGE PER CALL, deliberately. `apt-get install a b c` installs
          # NOTHING when any single name is unavailable: one unknown package
          # aborts the whole transaction. So wrapping the full list in
          # `|| echo warning` was WORSE than no tolerance at all -- it silently
          # turned "one advisory tool is missing" into "no dependencies at all".
          # That is exactly how this job lost libfuse3-dev and then died at the
          # build step reporting "FAIL: build first (make)": make was fine, the
          # headers were not there.
          for p in libjxl-tools p7zip-full qemu-system-x86 qemu-utils; do
            sudo apt-get install -y -qq "$p" \
              || echo "::warning::$p unavailable on this image (advisory)"
          done
      - name: host capability preflight
        # One report of every gap instead of a sweep dying at the first one.
        run: bash tools/e2e-preflight.sh --quiet || true
      - name: "fuse: allow other users"   # quoted: a colon-space in an
        # unquoted YAML scalar makes the parser read this as a mapping key
        # test-acl.sh mounts with -o allow_other; without this the suite stops
        # with "/etc/fuse.conf needs user_allow_other".
        run: |
          sudo sh -c 'grep -q "^user_allow_other" /etc/fuse.conf \
            || echo user_allow_other >> /etc/fuse.conf'
          grep -v "^#" /etc/fuse.conf || true
      - name: build
        run: make -j"$(nproc)" && make helpers

      # A throwaway keypair for the Arch guest, so the boot uses publickey auth
      # instead of sshpass.
      #
      # sshpass drives the password prompt through a PSEUDO-TERMINAL, and the
      # runner's /dev/pts cannot allocate one -- sshpass answered "Failed to get
      # a pseudo terminal: No such device" hundreds of times while the guest was
      # up and its sshd was listening on 0.0.0.0:22. The harness already supports
      # ARCH_SSH_KEY and the provisioner already installs it as
      # /root/.ssh/authorized_keys; nothing was passing it, so the only path
      # exercised was the one that needs a pty.
      #
      # Generated BEFORE the volume build, because that step is what bakes the
      # authorized_keys into the image. Exported to GITHUB_ENV so the boot step
      # picks it up too. Disposable: this key only ever reaches a throwaway
      # volume on a runner that dies with the job.
      - name: initramfs for the boot harnesses
        run: bash tools/mkinitramfs.sh

      - name: debian root -> InvariantFS volume
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/debian"
          mkdir -p "$S"
          # configure-debian.sh provisions an EXISTING Debian root (it
          # exits 1 unless sbin/init or lib/systemd is present) and
          # installs no packages itself, so the root has to be created
          # first. debootstrap a minbase with the boot-required packages
          # (docs/DEBIAN-INSTALL.md §1 table: systemd, dbus, udev,
          # openssh-server -- udev ships separately from systemd).
          sudo debootstrap --variant=minbase \
            --include=systemd,dbus,udev,openssh-server \
            trixie "$S"
          sudo chown -R "$(id -u):$(id -g)" "$S"
          bash tools/configure-debian.sh "$S"
          INVFS_DEB_STAGE="$S" bash tools/boot-debian-qemu.sh
      - name: debian root BOOTS on InvariantFS (single device)
        run: |
          set -o pipefail
          rc=0
          INVFS_DEB_STAGE="$RUNNER_TEMP/debian" \
            bash tools/boot-debian-qemu.sh \
              2>&1 | tee "$RUNNER_TEMP/debianboot.log" || rc=${PIPESTATUS[0]}
          cp /tmp/invfs-debian-boot-single.log "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
          exit $rc
      # Serial consoles are the evidence; kept per-distro so a
      # red job arrives with its own console to read.
      - name: upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-logs-debian
          path: |
            ${{ runner.temp }}/artifacts
            ${{ runner.temp }}/debianboot.log
          if-no-files-found: ignore

  # Fedora root (offline only for now): pinned Container-Base-Minimal OCI
  # tarball, hash-verified, layer-extracted, offline import (single +
  # two-device), fsck clean, bit-exact reads. No boot yet -- that needs
  # boot-fedora-qemu.sh, which does not exist. Scratch under RUNNER_TEMP.
  installation-bootstrap-fedora:
    needs: [engine, packaging-fedora]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev fuse3 zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3
      - name: build
        run: make -j"$(nproc)" && make helpers
      - name: fedora root -> InvariantFS volume (offline)
        run: |
          INVFS_FEDORA_WORK="$RUNNER_TEMP/fedora" \
            bash tools/test-fedora-install.sh
  packaging-fedora:
    needs: [engine]
    runs-on: ubuntu-22.04
    container: fedora:latest
    timeout-minutes: 40
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-v1-fedora-${{ hashFiles('Makefile', 'src/**/*.c', 'src/**/*.h', 'tools/codecpacks/**/*.c') }}
          restore-keys: |
            ccache-v1-fedora-

      - name: dependencies
        run: |
          dnf install -y gcc make pkgconf-pkg-config fuse3-devel zlib-devel \
            libzstd-devel systemd-rpm-macros rpm-build ccache python3 git \
            tar gzip file awk findutils

      - name: build
        run: |
          ccache --zero-stats >/dev/null 2>&1 || true
          ccache --max-size=1G >/dev/null 2>&1 || true
          CC="ccache gcc" make -j"$(nproc)" && CC="ccache gcc" make helpers
          ccache --show-stats || true

      - name: packaging suite (rpm native)
        run: bash tools/test-packaging.sh

  # Gentoo: a real emerge of the ebuild against the HEAD-built artifact.
  # The ebuild installs prebuilt binaries (no BUILD_DEPENDS); the RDEPENDs
  # come from the official binhost so nothing compiles but our own tree
  # (built by `make release` below). Distfiles are staged locally and the
  # Manifest regenerated -- the ebuild's BLAKE2B/SIZE pins are provenance
  # notes, portage's Manifest does the real verification.
  packaging-gentoo:
    needs: [engine]
    runs-on: ubuntu-22.04
    container: gentoo/stage3:latest
    timeout-minutes: 60
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: portage snapshot (webrsync, not a full git sync)
        run: |
          # Fresh stage3 ships repos.conf pointing at /var/db/repos/gentoo
          # but not the directory; portage validates the location before
          # it can populate it, so create it first.
          mkdir -p /var/db/repos/gentoo
          emerge-webrsync -q || emerge --sync -q

      - name: build the release artifact this ebuild will install
        run: |
          emerge -g -q app-arch/zstd sys-libs/zlib sys-fs/fuse:3 || emerge -q app-arch/zstd sys-libs/zlib sys-fs/fuse:3
          make -j"$(nproc)" && make release

      - name: local overlay with HEAD distfiles
        run: |
          set -euo pipefail
          ART=$(ls dist/invfs-*-x86_64.tar.zst | head -1)
          VER=$(cut -d- -f2 <<<"$(basename "$ART")")
          PV=${VER#v}
          OVERLAY=/var/db/repos/invfs-local
          mkdir -p "$OVERLAY/metadata" "$OVERLAY/sys-apps/invfs" "$OVERLAY/profiles"
          echo 'masters = gentoo' > "$OVERLAY/metadata/layout.conf"
          echo 'invfs-local' > "$OVERLAY/profiles/repo_name"
          mkdir -p /etc/portage/repos.conf
          printf '[invfs-local]\nlocation = %s\n' "$OVERLAY" > /etc/portage/repos.conf/invfs-local.conf
          cp "packaging/gentoo/invfs-$PV.ebuild" "$OVERLAY/sys-apps/invfs/" || cp packaging/gentoo/invfs-*.ebuild "$OVERLAY/sys-apps/invfs/"
          EB=$(ls "$OVERLAY/sys-apps/invfs"/invfs-*.ebuild | head -1)
          cp "$ART" dist/SHA256SUMS "$(portageq envvar DISTDIR)/"
          ( cd "$OVERLAY/sys-apps/invfs" && ebuild "$(basename "$EB")" manifest )
          mkdir -p /etc/portage/package.accept_keywords
          echo 'sys-apps/invfs ~amd64' >> /etc/portage/package.accept_keywords/invfs

      - name: emerge from the overlay, verify the install
        run: |
          set -euo pipefail
          EMERGE_DEFAULT_OPTS="--getbinpkg --usepkg" emerge -g -q sys-apps/invfs
          invf-mkfs --version

  # Stock-Arch-ISO install onto InvariantFS. Boots the pinned, checksummed
  # ISO pristine and fetches everything InvFS-specific from a local server
  # (recipe + release artifact + guest script); the guest makepkgs,
  # pacman -Us, pacstraps, images, verifies, and must print PASS and power
  # off. No KVM on runners: the driver falls back to TCG (slow), hence the
  # generous timeout. See tools/iso-arch-install.sh.
  installation-iso-arch:
    needs: [engine, packaging-arch]
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 qemu-system-x86 qemu-utils

      - name: build
        run: make -j"$(nproc)"

      - name: arch ISO install onto InvFS
        run: |
          WORK="$RUNNER_TEMP/iso" bash tools/iso-arch-install.sh

      # Post-installation proof: boot the just-imaged volume the same way
      # the (disabled) bootstrap job did. The ISO guest provisions
      # busybox-init + root pw + host keys for exactly this.
      - name: initramfs for the boot harness
        run: bash tools/mkinitramfs.sh

      - name: installed arch BOOTS on InvariantFS
        run: |
          set +e
          ARCH_WORK="$RUNNER_TEMP/archboot" \
          ARCH_LOG=/tmp/invfs-archboot.log \
          ARCH_SSH_LOG=/tmp/invfs-archboot.ssh.log \
            bash tools/boot-arch-qemu.sh --single "$RUNNER_TEMP/iso/vol.img" \
              2>&1 | tee "$RUNNER_TEMP/archboot.log"
          rc=${PIPESTATUS[0]}
          set -e
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp /tmp/invfs-archboot.log /tmp/invfs-archboot.ssh.log \
            "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
          exit $rc

      # The guest serial + serve log are the only evidence when the marker
      # never comes; without them a failed run is undebuggable (the driver
      # only prints its own lines, the guest's stay on the runner).
      # The guest serial + serve log are the only evidence when the marker
      # never comes; without them a failed run is undebuggable (the driver
      # only prints its own lines, the guest's stay on the runner).
      # Boot-phase consoles ride along too (see the boot step above).
      - name: upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-install-logs
          path: |
            ${{ runner.temp }}/iso/serial.log
            ${{ runner.temp }}/iso/serve.log
            ${{ runner.temp }}/artifacts
          if-no-files-found: warn

  # Stock-Void-ISO install onto InvariantFS. Boots the pinned, checksummed
  # ISO's kernel+initramfs pristine, breaks to the dracut debug shell
  # (rd.break=pre-pivot, driven over a bidirectional serial pipe), chroots
  # into the live root and runs the Handbook XBPS-method install
  # (xbps-install -r base-system) onto the volume: mkfs, batched import,
  # fsck, bit-exact spot checks, PASS, poweroff. No KVM on runners: the
  # driver falls back to TCG (slow), hence the generous timeout. See
  # tools/iso-void-install.sh. No void-installer TUI is driven anywhere.
  installation-iso-void:
    needs: [engine, packaging-void]
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 qemu-system-x86 qemu-utils e2fsprogs

      - name: build
        run: make -j"$(nproc)"

      - name: void ISO install onto InvFS
        run: |
          WORK="$RUNNER_TEMP/iso-void" bash tools/iso-void-install.sh

      # Same evidence rationale as the Arch ISO job above.
      - name: upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-void-install-logs
          path: |
            ${{ runner.temp }}/iso-void/serial.log
            ${{ runner.temp }}/iso-void/serve.log
          if-no-files-found: warn

  # Stock-Gentoo-minimal-ISO install onto InvariantFS. Boots the pinned,
  # checksummed ISO's kernel+initramfs pristine with the Handbook's own
  # unattended-install pair (dosshd + passwd=), SSHes in and runs the
  # Handbook stage3 install (pinned stage3 + SHA512): unpack, minimal
  # config, mkfs, batched import, fsck, bit-exact spot checks, PASS,
  # poweroff. No KVM on runners: the driver falls back to TCG (slow),
  # hence the generous timeout. See tools/iso-gentoo-install.sh. Gentoo
  # has no installer TUI; the Handbook install IS the CLI flow.
  installation-iso-gentoo:
    needs: [engine, packaging-gentoo]
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 qemu-system-x86 qemu-utils sshpass e2fsprogs

      - name: build
        run: make -j"$(nproc)"

      - name: gentoo ISO install onto InvFS
        run: |
          WORK="$RUNNER_TEMP/iso-gentoo" bash tools/iso-gentoo-install.sh

      # Same evidence rationale as the Arch ISO job above.
      - name: upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-gentoo-install-logs
          path: |
            ${{ runner.temp }}/iso-gentoo/serial.log
            ${{ runner.temp }}/iso-gentoo/serve.log
            ${{ runner.temp }}/iso-gentoo/ssh.log
          if-no-files-found: warn

  # Debian, natively: the same dpkg-buildpackage the matrix runs, but on
  # the real Debian toolchain instead of Ubuntu's. Full suite (foreign
  # legs skip, staged legs run, debian leg native).
  packaging-debian:
    runs-on: ubuntu-22.04
    container: debian:bookworm
    timeout-minutes: 40
    needs: [engine]
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential pkg-config git \
            libfuse3-dev zlib1g-dev libzstd-dev zstd xz-utils curl \
            python3 file gawk gzip debhelper devscripts \
            ca-certificates

      - name: build
        run: make -j"$(nproc)" && make helpers

      - name: packaging suite (deb native)
        run: bash tools/test-packaging.sh

  # Arch, natively: full suite in an Arch container (arch leg staged as
  # elsewhere) PLUS a real makepkg of the recipe against the
  # HEAD-built artifact -- the exact proof the staged leg cannot give
  # (it executes package(), never makepkg: the sha256sums filename bug
  # lived there). Containers run as root but makepkg refuses root (and
  # current pacman removed --asroot), so the build runs as a builder user.
  packaging-arch:
    runs-on: ubuntu-22.04
    container: archlinux:base
    timeout-minutes: 40
    needs: [engine]
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          pacman -Sy --needed --noconfirm gcc make pkgconf fuse3 zstd zlib \
            python3 tar gzip file awk fakeroot libarchive git

      - name: build
        run: make -j"$(nproc)" && make helpers

      - name: packaging suite (arch staged)
        run: bash tools/test-packaging.sh

      - name: real makepkg of the recipe
        run: |
          set -euo pipefail
          ART=$(ls dist/invfs-*-x86_64.tar.zst | head -1)
          D=/tmp/archpkg; rm -rf "$D"; mkdir -p "$D"
          cp packaging/PKGBUILD dist/SHA256SUMS "$ART" "$D/"
          cd "$D"
          H=$(cut -d' ' -f1 SHA256SUMS)
          sed -i "s/'[0-9a-f]\{64\}'/'$H'/" PKGBUILD
          # makepkg refuses root and current pacman removed --asroot:
          # build as an unprivileged user instead (HOME + cwd are his).
          id builder >/dev/null 2>&1 || useradd -m builder
          chown -R builder:builder "$D"
          runuser -u builder -- makepkg --noconfirm
          ls invfs-*.pkg.tar.zst
          pacman -Qip invfs-*.pkg.tar.zst | head -5

  # Void, natively: real xbps-src build of the template against the
  # HEAD-built artifact (staged do_install() runs inside the suite too).
  # xbps-src wants its void-packages tree: shallow clone + binary
  # bootstrap, then a local srcpkgs overlay with re-pinned distfiles
  # (same test-staging shape as the Gentoo job).
  packaging-void:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      # xbps-src builds as non-root inside user+mount namespaces and bind-
      # mounts /proc into its masterdir: needs real privilege, seccomp-
      # unconfined was not enough (bind mount denied).
      options: --privileged
    timeout-minutes: 90
    needs: [engine]
    # ethereal chroot style: the DOCUMENTED Docker flow (common/chroot-style
    # README). No namespaces, no mounts: symlinks emulate the chroot, the
    # container root is the masterdir, and BREAKOUT lets root run it all.
    # Disposable container; the symlinks die with it.
    env:
      XBPS_CHROOT_CMD: ethereal
      XBPS_ALLOW_CHROOT_BREAKOUT: "yes"
    # The full image ships no bash, so the runner falls back to sh and
    # every `set -euo pipefail` step dies with "Illegal option". The
    # bootstrap step installs bash under sh; everything after runs bash.
    defaults:
      run:
        shell: bash {0}
    steps:
      # fetch-depth 0 so TAGS are present (same VERSION reason as above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: bootstrap bash (no bash in the image; runner falls back to sh)
        shell: sh {0}
        run: xbps-install -Sy bash

      - name: toolchain + void-packages tree
        run: |
          set -euo pipefail
          # No xbps-src binary here: the package is absent from the repo
          # pool in this image, and the git clone + binary-bootstrap below
          # is the self-sufficient documented path (it fetches its own
          # static toolchain).
          xbps-install -Syu git base-devel pkg-config \
            fuse3-devel zlib-devel libzstd-devel zstd python3 tar \
            gzip curl file 2>&1 | tail -2
          [ -d /tmp/vp ] || git clone --depth 1 https://github.com/void-linux/void-packages /tmp/vp
          cd /tmp/vp && ./xbps-src binary-bootstrap
          # ethereal model: swap the bootstrapped masterdir for a symlink
          # to / (the container root, which already carries base-devel).
          # NOTE the name: under ethereal the default masterdir is plain
          # 'masterdir', not 'masterdir-<arch>'. Remove by existence, not
          # by glob (an unmatched glob plus set -e aborts the step; an
          # existing dir makes ln try to link *inside* it and fail).
          for d in /tmp/vp/masterdir /tmp/vp/masterdir-*/; do
            [ -e "$d" ] || [ -L "$d" ] || continue
            rm -rf "$d"
          done
          ln -s / /tmp/vp/masterdir

      - name: build
        run: make -j"$(nproc)" && make helpers

      - name: packaging suite (void staged)
        run: bash tools/test-packaging.sh

      - name: real xbps-src build of the template
        run: |
          set -euo pipefail
          ART=$(ls dist/invfs-*-x86_64.tar.zst | head -1)
          OVER=/tmp/vp/srcpkgs/invfs
          mkdir -p "$OVER"
          cp packaging/void/template "$OVER/template"
          VER=$(sed -n 's/^version=//p' "$OVER/template")
          # xbps-src only looks inside hostdir/sources/<pkg>-<ver>/; a copy
          # at the sources root is invisible and triggers a real fetch.
          SRCDIST=/tmp/vp/hostdir/sources/invfs-$VER
          mkdir -p "$SRCDIST"
          cp "$ART" "$SRCDIST/"
          H=$(cut -d' ' -f1 dist/SHA256SUMS)
          sed -i "s/^checksum=.*/checksum=$H/" "$OVER/template"
          grep -q "^checksum=$H$" "$OVER/template" || { echo "re-pin failed"; exit 1; }
          cd /tmp/vp && ./xbps-src pkg invfs
          ls hostdir/binpkgs/invfs-*.xbps
