name: release

# Cut per-distro packages and publish the GitHub release.
#   - on a v* tag push: build everything and publish (this IS the release)
#   - manual dispatch: build only, artifacts for inspection, no publish
# Source of truth is solely the Git Tag ($TAG). All version metadata
# across packages is stamped automatically by packaging/stamp-version.sh.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.6.9' }}

jobs:
  test-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config             libfuse3-dev zlib1g-dev libzstd-dev python3 qemu-utils
      - name: build
        run: make -j"$(nproc)"
      - name: repo hygiene
        run: bash tools/check-repo-hygiene.sh
      - name: unit tests
        run: make -j4 test TESTENV='INVFS_TEST_DEBUG=1'

  tarball:
    needs: [test-gate]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: stamp version from tag
        run: sh packaging/stamp-version.sh "$TAG"
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev python3
      - name: make release
        run: make release RELEASE_VERSION="$TAG"
      - name: verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist-tarball
          path: |
            dist/*.tar.zst
            dist/SHA256SUMS

  deb:
    needs: [test-gate]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: stamp version from tag
        run: sh packaging/stamp-version.sh "$TAG"
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config debhelper devscripts \
            libfuse3-dev zlib1g-dev libzstd-dev python3
      - name: debuild
        run: |
          ln -s packaging/debian debian
          dpkg-buildpackage -us -uc -b --no-sign
          mkdir -p debs && mv ../*.deb ../*.buildinfo ../*.changes debs/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-deb
          path: debs/

  arch:
    needs: [test-gate, tarball]
    runs-on: ubuntu-22.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: tree
      - uses: actions/download-artifact@v4
        with:
          name: dist-tarball
          path: pkg
      - name: build package
        run: |
          pacman -Sy --noconfirm --needed base-devel fuse3 zstd zlib
          sh tree/packaging/stamp-version.sh "$TAG"
          useradd -m builder
          cp tree/packaging/PKGBUILD pkg/
          cd pkg
          SHA=$(sha256sum invfs-*.tar.zst | cut -d' ' -f1)
          sed -i "s/^sha256sums=(.*)/sha256sums=('$SHA')/" PKGBUILD
          cp "$SHA" PKGBUILD "$GITHUB_WORKSPACE/" 2>/dev/null || true
          echo "$SHA" > TARBALL.sha256
          chown -R builder:builder .
          runuser -u builder -- makepkg --noconfirm
          cp PKGBUILD "$GITHUB_WORKSPACE/PKGBUILD-$TAG" 2>/dev/null || cp PKGBUILD /github/workspace/PKGBUILD 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: dist-arch
          path: |
            pkg/*.pkg.tar.zst
            pkg/TARBALL.sha256

  rpm:
    needs: [test-gate]
    runs-on: ubuntu-22.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: build RPM
        run: |
          dnf install -y rpm-build gzip gcc make pkgconf-pkg-config \
            fuse3-devel zlib-devel libzstd systemd-rpm-macros
          sh packaging/stamp-version.sh "$TAG"
          VER="${TAG#v}"
          mkdir -p rpmbuild/SOURCES
          tar --exclude=.git --exclude=./rpmbuild \
            -czf "rpmbuild/SOURCES/invfs-$VER.tar.gz" \
            --transform "s,^\./,invfs-$VER/," .
          rpmbuild -bb packaging/invfs.spec \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-rpm
          path: rpmbuild/RPMS/

  publish:
    if: github.event_name == 'push' && needs.test-gate.result == 'success' && needs.tarball.result == 'success' && needs.deb.result == 'success' && needs.arch.result == 'success' && needs.rpm.result == 'success'
    needs: [test-gate, tarball, deb, arch, rpm]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: stamp version from tag
        run: sh packaging/stamp-version.sh "$TAG"
      - uses: actions/download-artifact@v4
        with:
          name: dist-tarball
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: dist-deb
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: dist-arch
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: dist-rpm
          path: assets
      - name: flatten artifacts
        run: |
          find assets -mindepth 2 -type f -exec mv -t assets {} +
          find assets -mindepth 1 -type d -empty -delete
          ls assets/
      - name: stage recipes + notes
        run: |
          cp packaging/bootstrap.sh assets/
          cp "packaging/gentoo/invfs-${TAG#v}.ebuild" assets/
          cp packaging/void/template "assets/void-template-${TAG#v}" 2>/dev/null || true
          cp packaging/PKGBUILD "assets/PKGBUILD-${TAG#v}" 2>/dev/null || true
          { echo "InvariantFS $TAG — see CHANGELOG.md for the full list."; echo;
            echo "Install:"; echo "  - tarball: unpack, sudo sh packaging/install.sh";
            echo "  - debian/ubuntu: sudo dpkg -i invfs_*.deb";
            echo "  - arch: sudo pacman -U invfs-*.pkg.tar.zst";
            echo "  - fedora/rhel: sudo rpm -i invfs-*.rpm";
            echo "  - gentoo/void: ebuild/template recipes attached (source builds)";
            echo "Codec/container packs are installed manually in this release:";
            echo "  invf-pack install ./path/to/pack  (registry fetch: WP608, in progress)";
          } > assets/RELEASE-NOTES.txt
          ls assets/
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "$TAG" --notes-file assets/RELEASE-NOTES.txt --latest
          fi
      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: assets/*.tar.zst

  repro:
    needs: tarball
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: stamp version from tag
        run: sh packaging/stamp-version.sh "$TAG"
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev python3
      - name: double build + compare
        run: make release-verify RELEASE_VERSION="$TAG"

  repin:
    needs: [publish]
    if: always() && !cancelled() && needs.publish.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: dist-tarball
          path: repin-dl
      - name: re-pin hashes + push
        run: |
          set -eu
          sh packaging/stamp-version.sh "$TAG"
          VER="${TAG#v}"
          F=$(echo repin-dl/*.tar.zst)
          SHA=$(sha256sum "$F" | cut -d' ' -f1)
          B2=$(b2sum -l 256 "$F" | cut -d' ' -f1)
          SZ=$(wc -c < "$F" | tr -d ' ')
          EB="packaging/gentoo/invfs-$VER.ebuild"
          sed -i "s/^sha256sums=(.*)/sha256sums=('$SHA')/" packaging/PKGBUILD
          sed -i "s/^BLAKE2B=.*/BLAKE2B=\"$B2\"/; s/^SIZE=.*/SIZE=\"$SZ\"/" "$EB"
          sed -i "s/^checksum=.*/checksum=\"$SHA\"/" packaging/void/template
          git diff --exit-code --quiet && { echo "repin: already current"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/invarifs.h packaging/PKGBUILD "$EB" packaging/void/template packaging/invfs.spec packaging/debian/changelog
          git commit -m "packaging: re-pin $VER hashes and metadata from published artifacts (automated)"
          git pull --rebase origin main
          git push origin HEAD:main
