name: release

# Cut per-distro packages and publish the GitHub release.
#   - on a v* tag push: build everything and publish (this IS the release)
#   - manual dispatch: build only, artifacts for inspection, no publish
# v0.6.0 scope: tarball + .deb + Arch pkg + .rpm as binaries (the .rpm
# builds from a source tarball minted from the tag by git archive; Arch
# consumes the prebuilt tarball); the Gentoo ebuild and the Void template
# ship as recipes (no portage/xbps-src on hosted runners).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.6.0' }}

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: version coherence (tag vs tree)
        run: |
          set -x
          VER="${TAG#v}"
          echo "TAG=$TAG VER=$VER HEAD=$(git rev-parse HEAD)"
          # No VERSION file in-tree (make release generates it); the tag
          # itself is the version source of truth here. Compare by SHA so
          # a shallow checkout cannot confuse describe.
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
          grep -q "pkgver=$VER" packaging/PKGBUILD
          grep -q "^Version: *$VER$" packaging/invfs.spec
          grep -q "INVFS_VERSION_STRING \"v$VER\"" src/core/invarifs.h
          head -n 1 packaging/debian/changelog | grep -q "($VER-"
          echo "tree matches $TAG"

  tarball:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev python3
      - name: make release
        # Pin the version explicitly: git-describe luck (shallow clones,
        # missing tags, dubious ownership) must never stamp a wrong
        # version into a published artifact. TAG carries the v prefix
        # (RELEASE_NAME is invfs-$(RELEASE_VERSION)-...).
        run: make release RELEASE_VERSION="$TAG"
      - name: verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist-tarball
          path: |
            dist/*.tar.zst
            dist/SHA256SUMS

  deb:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config debhelper devscripts \
            libfuse3-dev zlib1g-dev libzstd-dev python3
      - name: debuild
        run: |
          # The packaging tree keeps debian/ under packaging/; debuild wants
          # it at the root. A CI-local symlink (never committed).
          ln -s packaging/debian debian
          debuild -us -uc -b
          # debuild drops artifacts in the parent dir; upload-artifact
          # forbids '..', so stage them inside the workspace.
          mkdir -p debs && mv ../*.deb ../*.buildinfo ../*.changes debs/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-deb
          path: debs/

  arch:
    needs: tarball
    runs-on: ubuntu-22.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: tree
      - uses: actions/download-artifact@v4
        with:
          name: dist-tarball
          path: pkg
      - name: build package
        run: |
          pacman -Sy --noconfirm --needed base-devel
          # Runtime deps only (the artifact is prebuilt), but install them so
          # makepkg's dependency check also validates the metadata names.
          pacman -Sy --noconfirm fuse3 zstd zlib
          useradd -m builder
          cp tree/packaging/PKGBUILD pkg/
          cd pkg
          # The tarball is built in this same run: pin its real hash so the
          # PKGBUILD a manual `makepkg` user reads matches the bytes.
          SHA=$(sha256sum invfs-*.tar.zst | cut -d' ' -f1)
          sed -i "s/^sha256sums=(.*)/sha256sums=('$SHA')/" PKGBUILD
          cp "$SHA" PKGBUILD "$GITHUB_WORKSPACE/" 2>/dev/null || true
          echo "$SHA" > TARBALL.sha256
          chown -R builder:builder .
          runuser -u builder -- makepkg --noconfirm
          cp PKGBUILD "$GITHUB_WORKSPACE/PKGBUILD-$TAG" 2>/dev/null || cp PKGBUILD /github/workspace/PKGBUILD 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: dist-arch
          path: |
            pkg/*.pkg.tar.zst
            pkg/TARBALL.sha256

  rpm:
    needs: preflight
    runs-on: ubuntu-22.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # The spec builds from source (Source0 is a source tarball), so mint
      # it from the checked-out tree. No git-in-container: the workspace
      # mount does not carry .git, so tar the tree with the spec's prefix.
      - name: build RPM
        run: |
          dnf install -y rpm-build gzip gcc make pkgconf-pkg-config \
            fuse3-devel zlib-devel libzstd systemd-rpm-macros
          VER="${TAG#v}"
          mkdir -p rpmbuild/SOURCES
          tar --exclude=.git --exclude=./rpmbuild \
            -czf "rpmbuild/SOURCES/invfs-$VER.tar.gz" \
            --transform "s,^\./,invfs-$VER/," .
          rpmbuild -bb packaging/invfs.spec \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-rpm
          path: rpmbuild/RPMS/

  publish:
    if: github.event_name == 'push'
    needs: [tarball, deb, arch, rpm]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: dist-tarball
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: dist-deb
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: dist-arch
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: dist-rpm
          path: assets
      # dist-rpm / dist-deb artifacts arrive nested (x86_64/, debs/); gh
      # release upload takes files, not directories -- flatten first.
      - name: flatten artifacts
        run: |
          find assets -mindepth 2 -type f -exec mv -t assets {} +
          find assets -mindepth 1 -type d -empty -delete
          ls assets/
      - name: stage recipes + notes
        run: |
          # bootstrap.sh is the README one-liner entry point
          # (releases/latest/download/bootstrap.sh) -- it must be an asset.
          cp packaging/bootstrap.sh assets/
          cp "packaging/gentoo/invfs-${TAG#v}.ebuild" assets/  # current version only; old ones ride with their own releases
          cp packaging/void/template "assets/void-template-${TAG#v}" 2>/dev/null || true
          cp packaging/PKGBUILD "assets/PKGBUILD-${TAG#v}" 2>/dev/null || true
          { echo "InvariantFS $TAG — see CHANGELOG.md for the full list."; echo;
            echo "Install:"; echo "  - tarball: unpack, sudo sh packaging/install.sh";
            echo "  - debian/ubuntu: sudo dpkg -i invfs_*.deb";
            echo "  - arch: sudo pacman -U invfs-*.pkg.tar.zst";
            echo "  - fedora/rhel: sudo rpm -i invfs-*.rpm";
            echo "  - gentoo/void: ebuild/template recipes attached (source builds)";
            echo "Codec/container packs are installed manually in this release:";
            echo "  invf-pack install ./path/to/pack  (registry fetch: WP608, in progress)";
          } > assets/RELEASE-NOTES.txt
          ls assets/
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "$TAG" --notes-file assets/RELEASE-NOTES.txt
          fi
      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: assets/*.tar.zst

  repro:
    # Bit-reproducibility proof: the same tag must always yield the same
    # bytes. Fails the release if the two builds differ.
    needs: tarball
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config \
            libfuse3-dev zlib1g-dev libzstd-dev python3
      - name: double build + compare
        run: make release-verify RELEASE_VERSION="$TAG"

  repin:
    # The target-native recipes pin the artifact digest; after publish,
    # write the real hashes back into the tree so the next tag starts
    # honest. Replaces the manual ab59373-style re-pin. Pushes to main;
    # engine-ci re-runs on it, release.yml does not (tag-only trigger).
    needs: [publish]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: dist-tarball
          path: repin-dl
      - name: re-pin hashes + push
        run: |
          set -eu
          VER="${TAG#v}"
          F=$(echo repin-dl/*.tar.zst)
          SHA=$(sha256sum "$F" | cut -d' ' -f1)
          B2=$(b2sum -l 256 "$F" | cut -d' ' -f1)
          SZ=$(wc -c < "$F" | tr -d ' ')
          EB="packaging/gentoo/invfs-$VER.ebuild"
          [ -f "$EB" ] || { echo "repin: $EB missing (copy the previous ebuild first)" >&2; exit 1; }
          sed -i "s/^sha256sums=(.*)/sha256sums=('$SHA')/" packaging/PKGBUILD
          sed -i "s/^BLAKE2B=.*/BLAKE2B=\"$B2\"/; s/^SIZE=.*/SIZE=\"$SZ\"/" "$EB"
          sed -i "s/^checksum=.*/checksum=\"$SHA\"/" packaging/void/template
          git diff --exit-code --quiet && { echo "repin: already current"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/PKGBUILD "$EB" packaging/void/template
          git commit -m "packaging: re-pin $VER hashes from published artifacts (automated)"
          git pull --rebase origin main
          git push origin HEAD:main
